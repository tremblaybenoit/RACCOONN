            _partial_: true
            path: ${data.stage.train.variables.hofx.path}
            dtype: ${data.dtype}
        # Pressure
        pressure:
          # Save function
          save:
            _target_: code.data.io.save_npy
            _partial_: true
            path: ${data.stage.train.variables.pressure.path}
            dtype: ${data.dtype}
