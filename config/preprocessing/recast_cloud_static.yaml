# Recast data to new format, spatiotemporal distribution
recast:
  # Source data
  source:
    # Function
    _target_: code.preprocessing.recast.recast_synthetic
    _recursive_: false  # Do not instantiate nested objects
    # What the method needs as input
    input:
      # Mask to apply
      mask:
        # Spatial domain:
        spatial_domain:
          lat_min: -60.0
          lat_max: 60.0
          lon_min: -180.0
          lon_max: 180.0
        # Temporal domain:
        temporal_window:
          scans_min: 0.0
          scans_max: 1.0
        # Cloud/clear sky
        cloud_mask: true
        clear_mask: false
      # Split
      split:
        # Ratio for split
        ratio:
          train: 0.6
          valid: 0.2
          test: 0.2
        # Seed
        seed: 42
        # Tolerance for edges (degrees)
        tolerance: 0.75
      # Directory of the source data
      dir: ../../../../../../../d/Data/JCSDA/GOES_ML
      # Variables
      variables:
        # Atmospheric profiles
        prof:
          # Load function
          load:
            _target_: numpy.concatenate
            _args_:
              - - _target_: code.data.io.load_npy
                  path: ${.......dir}/Train2/prof.npy
                - _target_: code.data.io.load_npy
                  path: ${.......dir}/Val2/prof.npy
                - _target_: code.data.io.load_npy
                  path: ${.......dir}/Test2/prof.npy
              - 0
        # Latitude
        lat:
          # Loading function
          load:
            _target_: numpy.concatenate
            _args_:
              - - _target_: code.data.io.load_latlon
                  path: ${.......dir}/Train2/lat.npy
                  scans:
                    _target_: code.data.io.load_scans
                    path: ${........dir}/Train2/scans.txt
                - _target_: code.data.io.load_latlon
                  path: ${.......dir}/Val2/lat.npy
                  scans:
                    _target_: code.data.io.load_scans
                    path: ${........dir}/Val2/scans.txt
                - _target_: code.data.io.load_latlon
                  path: ${.......dir}/Test2/lat.npy
                  scans:
                    _target_: code.data.io.load_scans
                    path: ${........dir}/Test2/scans.txt
              - 0
        # Longitude
        lon:
          # Loading function
          load:
            _target_: numpy.concatenate
            _args_:
              - - _target_: code.data.io.load_latlon
                  path: ${.......dir}/Train2/lon.npy
                  scans:
                    _target_: code.data.io.load_scans
                    path: ${........dir}/Train2/scans.txt
                - _target_: code.data.io.load_latlon
                  path: ${.......dir}/Val2/lon.npy
                  scans:
                    _target_: code.data.io.load_scans
                    path: ${........dir}/Val2/scans.txt
                - _target_: code.data.io.load_latlon
                  path: ${.......dir}/Test2/lon.npy
                  scans:
                    _target_: code.data.io.load_scans
                    path: ${........dir}/Test2/scans.txt
              - 0
        scans:
          # Loading function
          load:
            _target_: numpy.concatenate
            _args_:
              - - _target_: code.data.io.load_scans
                  path: ${.......dir}/Train2/scans.txt
                  lat:
                    _target_: code.data.io.load_latlon
                    path: ${........dir}/Train2/lat.npy
                - _target_: code.data.io.load_scans
                  path: ${.......dir}/Val2/scans.txt
                  lat:
                    _target_: code.data.io.load_latlon
                    path: ${........dir}/Val2/lat.npy
                - _target_: code.data.io.load_scans
                  path: ${.......dir}/Test2/scans.txt
                  lat:
                    _target_: code.data.io.load_latlon
                    path: ${........dir}/Test2/lat.npy
              - 0
        # Meta data
        meta:
          # Loading function
          load:
            _target_: numpy.concatenate
            _args_:
              - - _target_: code.data.io.load_npy
                  path: ${.......dir}/Train2/meta.npy
                - _target_: code.data.io.load_npy
                  path: ${.......dir}/Val2/meta.npy
                - _target_: code.data.io.load_npy
                  path: ${.......dir}/Test2/meta.npy
              - 0
        # Surface data
        surf:
          # Loading function
          load:
            _target_: numpy.concatenate
            _args_:
              - - _target_: code.data.io.load_npy
                  path: ${.......dir}/Train2/surf.npy
                - _target_: code.data.io.load_npy
                  path: ${.......dir}/Val2/surf.npy
                - _target_: code.data.io.load_npy
                  path: ${.......dir}/Test2/surf.npy
              - 0
        # Observations
        obs:
          # Loading function
          load:
            _target_: numpy.concatenate
            _args_:
              - - _target_: code.data.io.load_npy
                  path: ${.......dir}/Train2/obs.npy
                - _target_: code.data.io.load_npy
                  path: ${.......dir}/Val2/obs.npy
                - _target_: code.data.io.load_npy
                  path: ${.......dir}/Test2/obs.npy
              - 0
        # hofx
        hofx:
          # Loading function
          load:
            _target_: numpy.concatenate
            _args_:
              - - _target_: code.data.io.load_npy
                  path: ${.......dir}/Train2/hofx.npy
                - _target_: code.data.io.load_npy
                  path: ${.......dir}/Val2/hofx.npy
                - _target_: code.data.io.load_npy
                  path: ${.......dir}/Test2/hofx.npy
              - 0
        # Pressure
        pressure:
          # Loading function
          load:
            _target_: code.data.units.pa_to_hpa
            pressure:
              _target_: code.data.io.load_npy
              path: ${.....dir}/Train2/pressure.npy
    # What the method produces as output
    output:
      # Precision
      dtype: ${data.dtype}
      # Directory of the recast data
      dir: ${data.stage.train.dir}
      # Stage splitting
      stage:
        # Training set
        train:
          # Variables
          variables:
            # Atmospheric profiles
            prof:
