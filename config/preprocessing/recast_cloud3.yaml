    # What the method produces as output
    output:
      # Precision
      dtype: ${data.dtype}
      # Variables
      variables:
        # hofx
        hofx: ${data.stage.test.variables.hofx}
        # Latitude
        lat: ${data.stage.test.variables.lat}
        # Longitude
        lon: ${data.stage.test.variables.lon}
        # Meta data
        meta: ${data.stage.test.variables.meta}
        # Observations
