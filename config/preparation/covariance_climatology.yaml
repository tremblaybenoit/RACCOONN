# Error covariance matrices
covariance:

  # Error covariance matrix in model space
  B:
    # Function
    _target_: data.covariance.climatological_matrix
    _recursive_: false  # Do not instantiate nested objects
    # What the method needs as input
    input:
      # Variables to consider for the covariance estimation
      data:
        load:
          _target_: data.io.load_stack
          _recursive_: false
          stack:
            - ${data.stage.train.vars.prof}
            - ${data.stage.valid.vars.prof}
            - ${data.stage.test.vars.prof}
        normalization:  ${data.stage.train.vars.prof.normalization}
      # Pressure filter: Consider only pressure levels with non-zero variance
      pressure_filter: null  # ${data.pressure_filter}
    # Univariate or multivariate
    univariate: false
    # Scaling factor to apply to the covariance matrix (e.g., to account for model errors)
    scaling_factor: 1.0
    # Regularization parameter to ensure numerical stability
    regularization_factor: 1e-3
    # Plot flag
    plot_flag: true
    # Recentering
    recenter: false
    # What the method produces as output
    output:
      # Covariance matrix
      matrix:
        # File path to save/load the covariance matrix
        path: data/normalization/B_climatological_matrix.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.matrix.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.matrix.path}
      # Cholesky decomposition of the covariance matrix
      cholesky:
        # File path to save/load the Cholesky decomposition of the covariance matrix
        path: data/normalization/B_climatological_cholesky.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.cholesky.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.cholesky.path}
      # Inverse of the covariance matrix
      matrix_inverse:
        # File path to save/load the inverse of the covariance matrix
        path: data/normalization/B_climatological_matrix_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.matrix_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.matrix_inverse.path}
      # Inverse of the covariance matrix
      matrix_pseudo_inverse:
        # Parameters
        params:
          # Condition number threshold for the pseudo-inverse (e.g., to handle near-singular matrices)
          rcond: 1e-3
        # File path to save/load the inverse of the covariance matrix
        path: data/normalization/B_climatological_matrix_pseudo_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.matrix_pseudo_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.matrix_pseudo_inverse.path}

