# Error covariance matrices
covariance:

  # Error covariance matrix in model space
  B:
    # Function
    _target_: data.covariance.climatological_matrix
    _recursive_: false  # Do not instantiate nested objects
    # What the method needs as input
    input:
      # Variables to consider for the covariance estimation
      data:
        load:
          _target_: data.io.load_stack
          _recursive_: false
          stack:
            - _target_: data.io.load_npy
              path: ../static_clearskies_${data.dtype}/Train2/prof.npy
              dtype: ${data.dtype}
            - _target_: data.io.load_npy
              path: ../static_clearskies_${data.dtype}/Val2/prof.npy
              dtype: ${data.dtype}
            - _target_: data.io.load_npy
              path: ../static_clearskies_${data.dtype}/Test2/prof.npy
              dtype: ${data.dtype}
        normalization:  ${data.stage.train.vars.prof.normalization}
      # Pressure filter: Consider only pressure levels with non-zero variance
      pressure_filter: ${data.pressure_filter}
    # Univariate or multivariate
    univariate: false
    # Scaling factor to apply to the covariance matrix (e.g., to account for model errors)
    scaling_factor: 1.0
    # Regularization parameter to ensure numerical stability
    regularization_factor: 1e-3
    # Plot flag
    plot_flag: true
    # Recentering
    recenter: false
    # What the method produces as output
    output:
      # Covariance matrix
      matrix:
        # File path to save/load the covariance matrix
        path: data/normalization/B_climatological_matrix.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.matrix.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.matrix.path}
      # Cholesky decomposition of the covariance matrix
      cholesky:
        # File path to save/load the Cholesky decomposition of the covariance matrix
        path: data/normalization/B_climatological_cholesky.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.cholesky.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.cholesky.path}
      # Inverse of the covariance matrix
      matrix_inverse:
        # File path to save/load the inverse of the covariance matrix
        path: data/normalization/B_climatological_matrix_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.matrix_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.matrix_inverse.path}
      # Inverse of the covariance matrix
      matrix_pseudo_inverse:
        # Parameters
        params:
          # Condition number threshold for the pseudo-inverse (e.g., to handle near-singular matrices)
          rcond: 1e-3
        # File path to save/load the inverse of the covariance matrix
        path: data/normalization/B_climatological_matrix_pseudo_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.matrix_pseudo_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.matrix_pseudo_inverse.path}

  # Error covariance matrix in observation space
  R:
    # What the method produces as output
    output:
      # Covariance matrix
      matrix:
        # File path to save/load the covariance matrix
        path: data/normalization/R_matrix.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.matrix.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.matrix.path}
      # Inverse of the covariance matrix
      matrix_inverse:
        # File path to save/load the inverse of the covariance matrix
        path: data/normalization/R_matrix_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.matrix_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.matrix_inverse.path}
      # Pseudo-inverse of the covariance matrix
      matrix_pseudo_inverse:
        # Parameters
        params:
          # Condition number threshold for the pseudo-inverse (e.g., to handle near-singular matrices)
          rcond: 1e-3
        # File path to save/load the pseudo-inverse of the covariance matrix
        path: data/normalization/R_matrix_pseudo_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.matrix_pseudo_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.matrix_pseudo_inverse.path}
      # Correlation matrix
      correlation:
        # File path to save/load the correlation matrix
        path: data/normalization/R_correlation.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.correlation.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.correlation.path}
      # Inverse of the correlation matrix
      correlation_inverse:
        # File path to save/load the inverse of the correlation matrix
        path: data/normalization/R_correlation_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.correlation_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.correlation_inverse.path}
      # Pseudo-inverse of the correlation matrix
      correlation_pseudo_inverse:
        # Parameters
        params:
          # Condition number threshold for the pseudo-inverse (e.g., to handle near-singular matrices)
          rcond: 1e-3
        # File path to save/load the pseudo-inverse of the correlation matrix
        path: data/normalization/R_correlation_pseudo_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.correlation_pseudo_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.correlation_pseudo_inverse.path}