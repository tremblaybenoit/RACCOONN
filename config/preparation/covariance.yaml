# Error covariance matrices
covariance:

  # Error covariance matrix in model space
  B:
    # Function
    _target_: src.data.covariance.climatological_matrix
    _recursive_: false  # Do not instantiate nested objects
    # What the method needs as input
    input:
      # Variables to consider for the covariance estimation
      data:
        load: ${data.stage.source.variables.prof.load}
        transformations:  ${data.stage.source.variables.prof.transformations}
      # Latitude
      lat:
        load: ${data.stage.source.variables.lat.load}
      # Longitude
      lon:
        load: ${data.stage.source.variables.lon.load}
      # Scans
      scans:
        load: ${data.stage.source.variables.scans.load}
      # Pressure filter: Consider only pressure levels with non-zero variance
      pressure_filter: ${data.stage.source.variables.pressure_mask}
    # Univariate or multivariate
    univariate: true
    # Scaling factor to apply to the covariance matrix (e.g., to account for model errors)
    scaling_factor: 1.0
    # Regularization parameter to ensure numerical stability
    regularization_factor: 1e-3
    # Plot flag
    plot_flag: true
    # Recentering
    recenter: true
    # Type of recentering:
    mean_type: 'temporal'
    # What the method produces as output
    output:
      # Covariance matrix
      matrix:
        # File path to save/load the covariance matrix
        path: src/data/statistics/B_matrix.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.matrix.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.matrix.path}
      # Cholesky decomposition of the covariance matrix
      cholesky:
        # File path to save/load the Cholesky decomposition of the covariance matrix
        path: src/data/statistics/B_cholesky.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.cholesky.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.cholesky.path}
      # Inverse of the covariance matrix
      matrix_inverse:
        # File path to save/load the inverse of the covariance matrix
        path: src/data/statistics/B_matrix_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.matrix_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.matrix_inverse.path}
      # Pseudo-inverse of the covariance matrix
      matrix_pseudo_inverse:
        # Parameters
        params:
          # Condition number threshold for the pseudo-inverse (e.g., to handle near-singular matrices)
          rcond: 1e-3
        # File path to save/load the pseudo-inverse of the covariance matrix
        path: src/data/statistics/B_matrix_pseudo_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.B.output.matrix_pseudo_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.B.output.matrix_pseudo_inverse.path}

  # Error covariance matrix in observation space
  R:
    # Function
    _target_: src.data.covariance.climatological_matrix
    _recursive_: false  # Do not instantiate nested objects
    # What the method needs as input
    input:
      # Innovation estimates for the observation variables
      data:
        load:
          _target_: src.data.io.load_stack_and_normalize
          _recursive_: false
          stack:
            - ${data.stage.valid.variables.hofx_error}
            - ${data.stage.test.variables.hofx_error}
          transformations: null
      # Latitude
      lat:
        load:
          _target_: src.data.io.load_stack
          _recursive_: false
          stack:
            - ${data.stage.valid.variables.lat}
            - ${data.stage.test.variables.lat}
      # Longitude
      lon:
        load:
          _target_: src.data.io.load_stack
          _recursive_: false
          stack:
            - ${data.stage.valid.variables.lon}
            - ${data.stage.test.variables.lon}
      # Scans
      scans:
        load:
          _target_: src.data.io.load_stack
          _recursive_: false
          stack:
            - ${data.stage.valid.variables.scans}
            - ${data.stage.test.variables.scans}
    # Scaling factor to apply to the covariance matrix (e.g., to account for model errors)
    scaling_factor: 1.0
    # Regularization parameter to ensure numerical stability
    regularization_factor: 0.
    # Plot flag
    plot_flag: true
    # Recentering
    recenter: true
    mean_type: 'temporal'
    # What the method produces as output
    output:
      # Covariance matrix
      matrix:
        # File path to save/load the covariance matrix
        path: src/data/statistics/R_matrix.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.matrix.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.matrix.path}
      # Inverse of the covariance matrix
      matrix_inverse:
        # File path to save/load the inverse of the covariance matrix
        path: src/data/statistics/R_matrix_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.matrix_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.matrix_inverse.path}
      # Pseudo-inverse of the covariance matrix
      matrix_pseudo_inverse:
        # Parameters
        params:
          # Condition number threshold for the pseudo-inverse (e.g., to handle near-singular matrices)
          rcond: 1e-3
        # File path to save/load the pseudo-inverse of the covariance matrix
        path: src/data/statistics/R_matrix_pseudo_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.matrix_pseudo_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.matrix_pseudo_inverse.path}
      # Correlation matrix
      correlation:
        # File path to save/load the correlation matrix
        path: src/data/statistics/R_correlation.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.correlation.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.correlation.path}
      # Inverse of the correlation matrix
      correlation_inverse:
        # File path to save/load the inverse of the correlation matrix
        path: src/data/statistics/R_correlation_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.correlation_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.correlation_inverse.path}
      # Pseudo-inverse of the correlation matrix
      correlation_pseudo_inverse:
        # Parameters
        params:
          # Condition number threshold for the pseudo-inverse (e.g., to handle near-singular matrices)
          rcond: 1e-3
        # File path to save/load the pseudo-inverse of the correlation matrix
        path: src/data/statistics/R_correlation_pseudo_inverse.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${preparation.covariance.R.output.correlation_pseudo_inverse.path}
        # Load function
        load:
          _target_: numpy.load
          _args_:
            - ${preparation.covariance.R.output.correlation_pseudo_inverse.path}