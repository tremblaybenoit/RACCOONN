# Variational Loss for inverse problems using LossTerms
_target_: code.loss.wrapper.LossTerms

config:
  # Observation loss term: forward-modeled radiance vs. observations
  bt_crtm:
    weight: 1.0
    instance:
      _target_: code.loss.wrapper.LossTerm
      function:
        _target_: code.loss.variational.QuadraticForm
        matrix: ${preprocessing.covariance.R.output.matrix_inverse.load}
      output_keys: 'bt_inverse'
      target_keys: 'bt_crtm'

  # Model constraint: inverted profile vs. prior with pressure mask
  prof:
    weight: 1.0
    instance:
      _target_: code.loss.wrapper.LossTerm
      function:
        _target_: code.loss.basic.MSE
        # matrix: ${preprocessing.covariance.B.output.matrix_inverse.load}
      output_keys: 'prof_inverse'
      target_keys: 'prof_prior'
      # context_keys: 'variant_mask'

  # Sobolev regularization: horizontal smoothness (lat, lon)
  sobolev_horizontal:
    weight: 0.01
    instance:
      _target_: code.loss.wrapper.SobolevLossTerm
      function:
        _target_: code.loss.regularization.SobolevHorizontalRegularization
        input_keys: ['lat', 'lon']
        order: 1
      output_keys: 'prof_inverse'

  # Sobolev regularization: vertical smoothness (pressure_log)
  sobolev_vertical:
    weight: 0.01
    instance:
      _target_: code.loss.wrapper.SobolevLossTerm
      function:
        _target_: code.loss.regularization.SobolevVerticalRegularization
        input_key: 'pressure_log'
        order: 1
      output_keys: 'prof_inverse'

  # Boundary conditions: fixed profile levels (no masking)
  # bcs:
  #   weight: 1.0
  #   instance:
  #     _target_: code.loss.wrapper.LossTerm
  #     function:
  #       _target_: code.loss.basic.MSE
  #     output_keys: 'prof_inverse'
  #     target_keys: 'prof'
  #     context_keys: 'invariant_mask'