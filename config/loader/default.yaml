# Data loader configuration for model training
_target_: code.loader.loader.Dataloader
_recursive_: false
batch_size: 32  # Batch size for training
num_workers: 16  # Number of workers for data loading
persistent_workers: true  # Keep workers alive between epochs
pin_memory: true  # Pin memory for faster data transfer to GPU

# Stage-specific data loader configurations
stage:
  # Training stage
  train:
    _target_: code.loader.dataset.MultivariateDataset
    _recursive_: false
    input:
      _target_: code.model.loader.select_variables
      config: ${data.stage.train.variables}
      keys: ${data.select_input}
    target:
      _target_: code.model.loader.select_variables
      config: ${data.stage.train.variables}
      keys: ${data.select_output}
    context:
      _target_: code.model.loader.select_variables
      config: ${data.stage.train.variables}
      keys: ${data.select_context}
  # Validation stage
  valid:
    _target_: ${loader.stage.train._target_}
    _recursive_: false
    input:
      _target_: code.model.loader.select_variables
      config: ${data.stage.valid.variables}
      keys: ${data.select_input}
    target:
      _target_: code.model.loader.select_variables
      config: ${data.stage.valid.variables}
      keys: ${data.select_output}
    context:
      _target_: code.model.loader.select_variables
      config: ${data.stage.valid.variables}
      keys: ${data.select_context}
  # Test stage
  test:
    _target_: ${loader.stage.train._target_}
    _recursive_: false
    input:
      _target_: code.model.loader.select_variables
      config: ${data.stage.test.variables}
      keys: ${data.select_input}
    target:
      _target_: code.model.loader.select_variables
      config: ${data.stage.test.variables}
      keys: ${data.select_output}
    context:
      _target_: code.model.loader.select_variables
      config: ${data.stage.test.variables}
      keys: ${data.select_context}
    output:
      _target_: code.model.loader.select_variables
      config: ${data.stage.test.results}
      keys: ${data.select_output}
  # Prediction stage
  predict:
    _target_: ${loader.stage.train._target_}
    _recursive_: false
    input: ${loader.stage.test.input}
    output:
      _target_: code.model.loader.select_variables
      config: ${data.stage.predict.results}
      keys: ${data.select_output}