# Format:
#   stage:
#   -- source: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from source and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.
stage:
  # Training set
  train:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Metadata
      meta: &train
        # Dataset class
        _target_: forward.model.data_loader.TorchDataset
        _recursive_: false
        # Path to the metadata file
        path: ${....dir}/meta.npy
        # Loading function
        load:
          _target_: data.io.load_npy
          path: ${..path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations:
          # Metadata normalization (sin/cos for angles)
          normalization:
            _target_: data.transformations.NormalizeMeta
            settings:
              meta_cos_vars: [ 6 ]
              meta_scale_factor: 180
              meta_scale_offset: -180
              meta_scale_vars: [ ]
              meta_sin_vars: [ 0, 1, 2, 3, 4, 5 ]
  # Validation set
  valid:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Metadata
      meta:
        <<: *train
  # Test set
  test:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Metadata
      meta:
          <<: *train
    # Results-specific configuration for the test stage
    results:
      # Metadata
      meta:
        # Path to the metadata results file
        path: ${paths.run_dir}/test_meta.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${..path}
        load:
          _target_: data.io.load_npy
          path: ${..path}
          dtype: ${data.dtype}
  # Predict set
  predict:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Metadata
      meta:
        <<: *train
    # Results-specific configuration for the predict stage
    results:
      # Metadata
      meta:
        # Path to the metadata results file
        path: ${paths.run_dir}/predict_meta.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${..path}
        load:
          _target_: data.io.load_npy
          path: ${..path}
          dtype: ${data.dtype}
  # Source data (complete dataset)
  source:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Metadata
      meta:
        # Loading function
        load:
          _target_: numpy.concatenate
          _args_:
            - - ${data.stage.train.variables.meta.load}
              - ${data.stage.valid.variables.meta.load}
              - ${data.stage.test.variables.meta.load}
            - 0
        # Transformations to apply
        transformations: ${data.stage.train.variables.meta.transformations}

