defaults:
  - synthetic/default@stage
  - synthetic/hofx_forward@stage
  - synthetic/hofx_forward_mean@stage
  - synthetic/hofx_forward_stdev@stage
  - synthetic/variant_mask@stage
  - synthetic/invariant_mask@stage
  - synthetic/prof_prior@stage
  - synthetic/lat_slant@stage
  - synthetic/lon_slant@stage
  - synthetic/x_slant@stage
  - synthetic/y_slant@stage
  - synthetic/z_slant@stage
  - synthetic/default@source
  - synthetic/hofx_forward@source
  - synthetic/hofx_forward_mean@source
  - synthetic/hofx_forward_stdev@source
  - synthetic/variant_mask@source
  - synthetic/invariant_mask@source
  - synthetic/lat_slant@source
  - synthetic/lon_slant@source
  - synthetic/x_slant@source
  - synthetic/y_slant@source
  - synthetic/z_slant@source

# dtype
dtype: 'float32'

# Variables to use as input/output
select_input: ['lat', 'lon', 'scans', 'pressure']
select_target: ['hofx_forward', 'prof', 'prof_prior']
select_context: ['meta', 'surf', 'clear_mask', 'cloud_mask', 'daytime_mask', 'nighttime_mask',
                 'variant_mask', 'invariant_mask']

# Original data - Split the data into training, validation, and test sets
source:
  # Training set
  train:
    # Path to training data
    dir: ../synthetic_float32/Train2
    # Split
    split: null

  # Validation set
  valid:
    # Path to validation data
    dir: ../synthetic_float32/Val2
    # Split
    split: null

  # Test set
  test:
    # Path to test data
    dir: ../synthetic_float32/Test2
    # Split
    split: null

  # Prediction set
  predict: null

# Split the data into training, validation, and test sets
stage:
  # Training set
  train:
    # Path to training data
    dir: ${paths.data_dir}/Train2
    # Split
    split: null
    # Variables
    variables:
      # Atmospheric profiles
      prof:
        # Transformations to apply
        transformations:
          # Per-variable normalization
          normalization:
            _target_: code.data.transformations.min_max
            _partial_: true
            stats:
              _target_: code.preprocessing.statistics.read_statistics_var
              path: ${preprocessing.statistics.output.path}
              key: 'prof'
              dtype: ${data.dtype}
  # Validation set
  valid:
    # Path to validation data
    dir: ${paths.data_dir}/Val2
    # Split
    split: null
    # Variables
    variables:
      # Atmospheric profiles
      prof:
        # Transformations to apply
        transformations: ${data.stage.train.variables.prof.transformations}

  # Test set
  test:
    # Path to test data
    dir: ${paths.data_dir}/Test2
    # Split
    split: null
    # Variables
    variables:
      # Atmospheric profiles
      prof:
        # Transformations to apply
        transformations: ${data.stage.train.variables.prof.transformations}

  # Prediction set (NOTE: By default, we use the test set as the prediction set for demonstration purposes)
  predict:
    # Path to prediction data
    dir: ${data.stage.test.dir}
    # Split
    split: ${data.stage.test.split}
    # Variables
    variables:
      # Atmospheric profiles
      prof:
        # Transformations to apply
        transformations: ${data.stage.train.variables.prof.transformations}