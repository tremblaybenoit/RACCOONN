defaults:
  - synthetic/clear_mask
  - synthetic/cloud_mask
  - synthetic/daytime_mask
  - synthetic/hofx
  - synthetic/hofx_forward
  - synthetic/lat
  - synthetic/lon
  - synthetic/meta
  - synthetic/obs
  - synthetic/pressure
  - synthetic/pressure_log
  - synthetic/pressure_mask
  - synthetic/prof
  - synthetic/prof_prior
  - synthetic/scans
  - synthetic/surf

# dtype
dtype: 'float32'

# Variables to use as input/output
select_input: ['lat', 'lon', 'scans', 'pressure']
select_target: ['meta', 'surf', 'hofx_forward', 'prof', 'prof_prior']
select_context: ['clear_mask', 'cloud_mask', 'daytime_mask', 'pressure_mask']
# select_context: ['meta', 'surf', 'clear_mask', 'cloud_mask', 'daytime_mask', 'pressure_mask']

# Split the data into training, validation, and test sets
stage:
  # Training set
  train:
    # Path to training data
    dir: ${paths.data_dir}/Train2
    # Split
    split: null
    # Variables
    variables:
      # Atmospheric profiles
      prof:
        # Transformations to apply
        transformations:
          # Per-variable normalization
          normalization:
            _target_: src.data.transformations.min_max
            _partial_: true
            stats:
              _target_: src.data.preprocessing.statistics.read_statistics_var
              path: ${preprocessing.statistics.data.output.path}
              key: 'prof'
              dtype: ${data.dtype}
  # Validation set
  valid:
    # Path to validation data
    dir: ${paths.data_dir}/Val2
    # Split
    split: null
    # Variables
    variables:
      # Atmospheric profiles
      prof:
        # Transformations to apply
        transformations: ${data.stage.train.variables.prof.transformations}

  # Test set
  test:
    # Path to test data
    dir: ${paths.data_dir}/Test2
    # Split
    split: null
    # Variables
    variables:
      # Atmospheric profiles
      prof:
        # Transformations to apply
        transformations: ${data.stage.train.variables.prof.transformations}

  # Prediction set (NOTE: By default, we use the test set as the prediction set for demonstration purposes)
  predict:
    # Path to prediction data
    dir: ${data.stage.test.dir}
    # Split
    split: ${data.stage.test.split}
    # Variables
    variables:
      # Atmospheric profiles
      prof:
        # Transformations to apply
        transformations: ${data.stage.train.variables.prof.transformations}