# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Surface variables
    surf:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Path to the surface variables file
      path: ${...dir}/surf.npy
      # Surface variable types
      type: ['Ice area fraction', 'Land area fraction', 'Land type index', 'Leaf area index', 'Soil temperature',
             'Surface snow area fraction', 'Surface snow thickness', 'Surface ice temperature',
             'Surface soil temperature', 'Surface sea temperature', 'Surface snow temperature',
             'Surface eastward wind component', 'Surface northward wind component',
             'Vegetation area fraction', 'Fraction of condensed water', 'Water area fraction']
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: code.data.io.save_npy
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations:
        # Surface normalization
        normalization:
          _target_: code.data.transformations.NormalizeSurface
          surfmax:
            _target_: numpy.loadtxt
            _args_:
              - data/normalization/surfmax.txt
          surfmin:
            _target_: numpy.loadtxt
            _args_:
              - data/normalization/surfmin.txt
          dtype: ${data.dtype}
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Surface variables
    surf:
      # Dataset class
      _target_: ${....train.variables.surf._target_}
      _recursive_: false
      # Path to the surface variables file
      path: ${...dir}/surf.npy
      # Surface variable types
      type: ${....train.variables.surf.type}
      # Loading function
      load:
        _target_: ${.....train.variables.surf.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: ${.....train.variables.surf.save._target_}
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.surf.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Surface variables
    surf:
      # Dataset class
      _target_: ${....train.variables.surf._target_}
      _recursive_: false
      # Path to the surface variables file
      path: ${...dir}/surf.npy
      # Surface variable types
      type: ${....train.variables.surf.type}
      # Loading function
      load:
        _target_: ${.....train.variables.surf.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: ${.....train.variables.surf.save._target_}
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.surf.transformations}
# Predict set
predict:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Surface variables
    surf:
      # Dataset class
      _target_: ${....train.variables.surf._target_}
      _recursive_: false
      # Path to the surface variables file
      path: ${...dir}/surf.npy
      # Surface variable types
      type: ${....train.variables.surf.type}
      # Loading function
      load:
        _target_: ${.....train.variables.surf.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.surf.transformations}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Surface variables
    surf:
      # Dataset class
      _target_: ${....train.variables.surf._target_}
      _recursive_: false
      # Surface variable types
      type: ${....train.variables.surf.type}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${.......train.variables.surf.load}
            - ${.......valid.variables.surf.load}
            - ${.......test.variables.surf.load}
          - 0
      # Transformations to apply
      transformations: ${....train.variables.surf.transformations}