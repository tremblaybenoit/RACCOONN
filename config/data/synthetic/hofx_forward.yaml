# Format:
#   stage:
#   -- source: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from source and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.
stage:
  # Training set
  train:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # HOFX (Simulated Observations)
      hofx_forward:
        # Dataset class
        _target_: src.loader.dataset.EagerDataset
        _recursive_: false
        # Path to the HOFX (simulated observations) file
        path: ${....dir}/hofx_forward.npy
        # Channels
        type: [
          'Channel 7', 'Channel 8', 'Channel 9', 'Channel 10', 'Channel 11', 'Channel 12',
          'Channel 13', 'Channel 14', 'Channel 15', 'Channel 16'
        ]
        # Loading function
        load:
          _target_: src.data.io.load_npy
          path: ${..path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations:
          # Per-variable normalization
          normalization:
            _target_: src.data.transformations.identity
            _partial_: true
            stats:
              _target_: src.data.statistics.read_statistics_var
              path: ${preparation.statistics.data.output.path}
              var: 'hofx'
              dtype: ${data.dtype}
  # Validation set
  valid:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # HOFX (Simulated Observations)
      hofx_forward:
        # Dataset class
        _target_: ${data.stage.train.variables.hofx_forward._target_}
        _recursive_: false
        # Path to the HOFX (simulated observations) file
        path: ${....dir}/hofx_forward.npy
        # Channels
        type: ${data.stage.train.variables.hofx_forward.type}
        # Loading function
        load:
          _target_: ${data.stage.train.variables.hofx_forward.load._target_}
          path: ${..path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations: ${data.stage.train.variables.hofx_forward.transformations}
  # Test set
  test:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # HOFX (Simulated Observations)
      hofx_forward:
        # Dataset class
        _target_: ${data.stage.train.variables.hofx_forward._target_}
        _recursive_: false
        # Path to the HOFX (simulated observations) file
        path: ${....dir}/hofx_forward.npy
        # Channels
        type: ${data.stage.train.variables.hofx_forward.type}
        # Loading function
        load:
          _target_: ${data.stage.train.variables.hofx_forward.load._target_}
          path: ${..path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations: ${data.stage.train.variables.hofx_forward.transformations}
    # Results-specific configuration for the test stage
    results:
      # HOFX (Simulated Observations)
      hofx_forward:
        # Path to the HOFX results file
        path: ${paths.run_dir}/test_hofx_forward.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${..path}
        load:
          _target_: src.data.io.load_npy
          path: ${..path}
          dtype: ${data.dtype}
  # Predict set
  predict:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # HOFX (Simulated Observations)
      hofx_forward: ${data.stage.test.variables.hofx_forward}
    # Results-specific configuration for the predict stage
    results:
      # HOFX (Simulated Observations)
      hofx_forward:
        # Path to the HOFX results file
        path: ${paths.run_dir}/predict_hofx_forward.npy
        # Save function
        save:
          _target_: numpy.save
          _partial_: true
          _args_:
            - ${..path}
        load:
          _target_: src.data.io.load_npy
          path: ${..path}
          dtype: ${data.dtype}
  # Source data (complete dataset)
  source:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # HOFX (Simulated Observations)
      hofx_forward:
        # Channels
        type: ${data.stage.train.variables.hofx_forward.type}
        # Loading function
        load:
          _target_: numpy.concatenate
          _args_:
            - - ${data.stage.train.variables.hofx_forward.load}
              - ${data.stage.valid.variables.hofx_forward.load}
              - ${data.stage.test.variables.hofx_forward.load}
            - 0
        # Transformations to apply
        transformations: ${data.stage.train.variables.hofx_forward.transformations}

