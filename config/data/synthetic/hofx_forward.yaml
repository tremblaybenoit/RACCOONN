# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    hofx_forward:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...results.hofx.path}
      # Channels
      type: ${..hofx.type}
      # Number of variables
      n: ${..hofx.n}
      # Loading function
      load: ${...results.hofx.load}
      # Transformations to apply
      transformations: ${..hofx.transformations}
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    hofx_forward:
      # Dataset class
      _target_: ${data.stage.train.variables.hofx_forward._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...results.hofx.path}
      # Channels
      type: ${data.stage.train.variables.hofx_forward.type}
      # Number of variables
      n: ${data.stage.train.variables.hofx_forward.n}
      # Loading function
      load: ${...results.hofx.load}
      # Transformations to apply
      transformations: ${data.stage.train.variables.hofx_forward.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    hofx_forward:
      # Dataset class
      _target_: ${data.stage.train.variables.hofx_forward._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...results.hofx.path}
      # Channels
      type: ${data.stage.train.variables.hofx_forward.type}
      # Number of variables
      n: ${data.stage.train.variables.hofx_forward.n}
      # Loading function
      load: ${...results.hofx.load}
      # Transformations to apply
      transformations: ${data.stage.train.variables.hofx_forward.transformations}
  # Results-specific configuration for the test stage
  results:
    # HOFX (Simulated Observations)
    hofx_forward:
      # Path to the HOFX results file
      path: ${paths.run_dir}/test_hofx_forward.npy
      # Save function
      save:
        _target_: numpy.save
        _partial_: true
        _args_:
          - ${...path}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${data.stage.train.variables.hofx_forward.transformations}
# Predict set
predict:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    hofx_forward: ${data.stage.test.variables.hofx_forward}
  # Results-specific configuration for the predict stage
  results:
    # HOFX (Simulated Observations)
    hofx_forward:
      # Path to the HOFX results file
      path: ${paths.run_dir}/predict_hofx_forward.npy
      # Save function
      save:
        _target_: numpy.save
        _partial_: true
        _args_:
          - ${...path}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${data.stage.train.variables.hofx_forward.transformations}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    hofx_forward:
      # Dataset class
      _target_: ${data.stage.train.variables.hofx_forward._target_}
      _recursive_: false
      # Channels
      type: ${data.stage.train.variables.hofx_forward.type}
      # Number of variables
      n: ${data.stage.train.variables.hofx_forward.n}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${data.stage.train.variables.hofx_forward.load}
            - ${data.stage.valid.variables.hofx_forward.load}
            - ${data.stage.test.variables.hofx_forward.load}
          - 0
      # Transformations to apply
      transformations: ${data.stage.train.variables.hofx_forward.transformations}