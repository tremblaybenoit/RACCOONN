# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    nnofx_stdev:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/nnofx_stdev.npy
      # Channels
      type: ${..nnofx.type}
      # Number of variables
      n: ${..nnofx.n}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: code.data.io.save_npy
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: null
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    nnofx_stdev:
      # Dataset class
      _target_: ${....train.variables.nnofx_stdev._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/nnofx_stdev.npy
      # Channels
      type: ${....train.variables.nnofx_stdev.type}
      # Number of variables
      n: ${....train.variables.nnofx_stdev.n}
      # Loading function
      load:
        _target_: ${.....train.variables.nnofx_stdev.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: ${.....train.variables.nnofx_stdev.save._target_}
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.nnofx_stdev.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    nnofx_stdev:
      # Dataset class
      _target_: ${....train.variables.nnofx_stdev._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/nnofx_stdev.npy
      # Channels
      type: ${....train.variables.nnofx_stdev.type}
      # Number of variables
      n: ${....train.variables.nnofx_stdev.n}
      # Loading function
      load:
        _target_: ${.....train.variables.nnofx_stdev.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: ${.....train.variables.nnofx_stdev.save._target_}
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.nnofx_stdev.transformations}
  # Results-specific configuration for the test stage
  results:
    # HOFX (Simulated Observations)
    nnofx_stdev:
      # Path to the HOFX results file
      path: ${paths.run_dir}/nnofx_stdev_test.npy
      # Save function
      save:
        _target_: numpy.save
        _partial_: true
        _args_:
          - ${...path}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.nnofx_stdev.transformations}
# Predict set
predict:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    nnofx_stdev: ${...test.variables.nnofx_stdev}
  # Results-specific configuration for the predict stage
  results:
    # HOFX (Simulated Observations)
    nnofx_stdev:
      # Path to the HOFX results file
      path: ${paths.run_dir}/nnofx_stdev_predict.npy
      # Save function
      save:
        _target_: numpy.save
        _partial_: true
        _args_:
          - ${...path}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.nnofx_stdev.transformations}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    nnofx_stdev:
      # Dataset class
      _target_: ${....train.variables.nnofx_stdev._target_}
      _recursive_: false
      # Channels
      type: ${....train.variables.nnofx_stdev.type}
      # Number of variables
      n: ${....train.variables.nnofx_stdev.n}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${.......train.variables.nnofx_stdev.load}
            - ${.......valid.variables.nnofx_stdev.load}
            - ${.......test.variables.nnofx_stdev.load}
          - 0
      # Transformations to apply
      transformations: ${....train.variables.nnofx_stdev.transformations}