# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    nnofx:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/nnofx.npy
      # Channels
      type: ${..hofx.type}
      # Number of variables
      n: ${..hofx.n}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: code.data.io.save_npy
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations:
        # Per-variable normalization
        normalization:
          _target_: code.data.transformations.identity
          _partial_: true
          stats:
            _target_: code.preprocessing.statistics.read_statistics_var
            load: ${preprocessing.statistics.output.load}
            key: 'nnofx'
            dtype: ${data.dtype}
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    nnofx:
      # Dataset class
      _target_: ${....train.variables.nnofx._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/nnofx.npy
      # Channels
      type: ${....train.variables.nnofx.type}
      # Number of variables
      n: ${....train.variables.nnofx.n}
      # Loading function
      load:
        _target_: ${.....train.variables.nnofx.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: ${.....train.variables.nnofx.save._target_}
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.nnofx.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    nnofx:
      # Dataset class
      _target_: ${....train.variables.nnofx._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/nnofx.npy
      # Channels
      type: ${....train.variables.nnofx.type}
      # Number of variables
      n: ${....train.variables.nnofx.n}
      # Loading function
      load:
        _target_: ${.....train.variables.nnofx.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: ${.....train.variables.nnofx.save._target_}
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.nnofx.transformations}
  # Results-specific configuration for the test stage
  results:
    # HOFX (Simulated Observations)
    nnofx:
      # Path to the HOFX results file
      path: ${paths.run_dir}/nnofx_test.npy
      # Save function
      save:
        _target_: numpy.save
        _partial_: true
        _args_:
          - ${...path}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.nnofx.transformations}
# Predict set
predict:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    nnofx: ${...test.variables.nnofx}
  # Results-specific configuration for the predict stage
  results:
    # HOFX (Simulated Observations)
    nnofx:
      # Path to the HOFX results file
      path: ${paths.run_dir}/nnofx_predict.npy
      # Save function
      save:
        _target_: numpy.save
        _partial_: true
        _args_:
          - ${...path}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.nnofx.transformations}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    nnofx:
      # Dataset class
      _target_: ${....train.variables.nnofx._target_}
      _recursive_: false
      # Channels
      type: ${....train.variables.nnofx.type}
      # Number of variables
      n: ${....train.variables.nnofx.n}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${.......train.variables.nnofx.load}
            - ${.......valid.variables.nnofx.load}
            - ${.......test.variables.nnofx.load}
          - 0
      # Transformations to apply
      transformations: ${....train.variables.nnofx.transformations}