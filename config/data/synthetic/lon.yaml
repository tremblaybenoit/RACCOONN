# Format:
#   stage:
#   -- source: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from source and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.
stage:
  # Training set
  train:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Longitude
      lon:
        # Dataset class
        _target_: src.loader.dataset.EagerDataset
        _recursive_: false
        # Path to the longitude data file
        path: ${....dir}/lon.npy
        # Type of data
        type: 'Longitude (degrees)'
        # Loading function
        load:
          _target_: src.data.io.load_latlon
          path: ${..path}
          scans:
            _target_: ${....scans.load._target_}
            path: ${....scans.load.path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations:
          # Per-variable normalization
          normalization:
            _target_: src.data.transformations.min_max
            _partial_: true
            stats:
              _target_: src.data.statistics.read_statistics_var
              path: ${preprocessing.statistics.data.output.path}
              key: 'lon'
              dtype: ${data.dtype}
  # Validation set
  valid:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Longitude
      lon:
        # Dataset class
        _target_: ${data.stage.train.variables.lon._target_}
        _recursive_: false
        # Path to the longitude data file
        path: ${....dir}/lon.npy
        # Type of data
        type: ${data.stage.train.variables.lon.type}
        # Loading function
        load:
          _target_: ${data.stage.train.variables.lon.load._target_}
          path: ${..path}
          scans:
            _target_: ${....scans.load._target_}
            path: ${....scans.load.path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations: ${data.stage.train.variables.lon.transformations}
  # Test set
  test:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Longitude
      lon:
        # Dataset class
        _target_: ${data.stage.train.variables.lon._target_}
        _recursive_: false
        # Path to the longitude data file
        path: ${....dir}/lon.npy
        # Type of data
        type: ${data.stage.train.variables.lon.type}
        # Loading function
        load:
          _target_: ${data.stage.train.variables.lon.load._target_}
          path: ${..path}
          scans:
            _target_: ${....scans.load._target_}
            path: ${....scans.load.path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations: ${data.stage.train.variables.lon.transformations}
  # Predict set
  predict:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Longitude
      lon: ${...test.variables.lon}
  # Source data (complete dataset)
  source:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Longitude
      lon:
        # Type of data
        type: ${data.stage.train.variables.lon.type}
        # Loading function
        load:
          _target_: numpy.concatenate
          _args_:
            - - ${data.stage.train.variables.lon.load}
              - ${data.stage.valid.variables.lon.load}
              - ${data.stage.test.variables.lon.load}
            - 0
        # Transformations to apply
        transformations: ${data.stage.train.variables.lon.transformations}

