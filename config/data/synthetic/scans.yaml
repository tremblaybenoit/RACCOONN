# Format:
#   stage:
#   -- source: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from source and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.
stage:
  # Training set
  train:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Scans
      scans:
        # Dataset class
        _target_: src.loader.dataset.EagerDataset
        _recursive_: false
        # Path to the scans data file
        path: ${....dir}/scans.txt
        # Type of scans
        type: 'Time'
        # Loading function
        load:
          _target_: src.data.io.load_scans
          path: ${..path}
          lat:
            _target_: ${....lat.load._target_}
            path: ${....lat.load.path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations:
          # Per-variable normalization
          normalization:
            _target_: src.data.transformations.min_max
            _partial_: true
            stats:
              _target_: src.data.statistics.read_statistics_var
              path: ${preparation.statistics.data.output.path}
              var: 'scans'
              dtype: ${data.dtype}
  # Validation set
  valid:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Scans
      scans:
        # Dataset class
        _target_: ${data.stage.train.variables.scans._target_}
        _recursive_: false
        # Path to the scans data file
        path: ${....dir}/scans.txt
        # Type of scans
        type: ${data.stage.train.variables.scans.type}
        # Loading function
        load:
          _target_: ${data.stage.train.variables.scans.load._target_}
          path: ${..path}
          lat:
            _target_: ${....lat.load._target_}
            path: ${....lat.load.path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations: ${data.stage.train.variables.scans.transformations}
  # Test set
  test:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Scans
      scans:
        # Dataset class
        _target_: ${data.stage.train.variables.scans._target_}
        _recursive_: false
        # Path to the scans data file
        path: ${....dir}/scans.txt
        # Type of scans
        type: ${data.stage.train.variables.scans.type}
        # Loading function
        load:
          _target_: ${data.stage.train.variables.scans.load._target_}
          path: ${..path}
          lat:
            _target_: ${....lat.load._target_}
            path: ${....lat.load.path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations: ${data.stage.train.variables.scans.transformations}
  # Predict set
  predict:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Scans
      scans: ${...test.variables.scans}
  # Source data (complete dataset)
  source:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Scans
      scans:
        # Type of scans
        type: ${data.stage.train.variables.scans.type}
        # Loading function
        load:
          _target_: numpy.concatenate
          _args_:
            - - ${data.stage.train.variables.scans.load}
              - ${data.stage.valid.variables.scans.load}
              - ${data.stage.test.variables.scans.load}
            - 0
        # Transformations to apply
        transformations: ${data.stage.train.variables.scans.transformations}

