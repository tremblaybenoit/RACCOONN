# Format:
#   stage:
#   -- source: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from source and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.
stage:
  # Training set
  train:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Cloud mask
      clear_mask:
        # Dataset class
        _target_: src.loader.dataset.EagerDataset
        _recursive_: false
        # Type of data
        type: 'Cloud mask'
        # Loading function (clear filter is computed, not loaded directly)
        load:
          _target_: src.data.filters.clear_mask
          _args_:
            - ${....meta.load}
        # Transformations to apply
        transformations: null
  # Validation set
  valid:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Cloud mask
      clear_mask:
        # Dataset class
        _target_: ${data.stage.train.variables.clear_mask._target_}
        _recursive_: false
        # Type of data
        type: ${data.stage.train.variables.clear_mask.type}
        # Loading function (clear filter is computed, not loaded directly)
        load:
          _target_: ${data.stage.train.variables.clear_mask.load._target_}
          _args_:
            - ${....meta.load}
        # Transformations to apply
        transformations: ${data.stage.train.variables.clear_mask.transformations}
  # Test set
  test:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Cloud mask
      clear_mask:
        # Dataset class
        _target_: ${data.stage.train.variables.clear_mask._target_}
        _recursive_: false
        # Type of data
        type: ${data.stage.train.variables.clear_mask.type}
        # Loading function (clear filter is computed, not loaded directly)
        load:
          _target_: ${data.stage.train.variables.clear_mask.load._target_}
          _args_:
            - ${....meta.load}
        # Transformations to apply
        transformations: ${data.stage.train.variables.clear_mask.transformations}
  # Predict set
  predict:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Cloud mask
      clear_mask: ${...test.variables.clear_mask}
  # Source data (complete dataset)
  source:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Cloud mask
      clear_mask:
        # Type of data
        type: ${data.stage.train.variables.clear_mask.type}
        # Loading function
        load:
          _target_: numpy.concatenate
          _args_:
            - - ${data.stage.train.variables.clear_mask.load}
              - ${data.stage.valid.variables.clear_mask.load}
              - ${data.stage.test.variables.clear_mask.load}
            - 0
        # Transformations to apply
        transformations: null

