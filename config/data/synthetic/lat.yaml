# Format:
#   stage:
#   -- source: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from source and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.
stage:
  # Training set
  train:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Latitude
      lat:
        # Dataset class
        _target_: forward.model.data_loader.EagerDataset
        _recursive_: false
        # Path to the latitude data file
        path: ${....dir}/lat.npy
        # Type of data
        type: 'Latitude (degrees)'
        # Loading function
        load:
          _target_: data.io.load_latlon
          path: ${..path}
          scans:
            _target_: ${....scans.load._target_}
            path: ${....scans.load.path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations:
          # Per-variable normalization
          normalization:
            _target_: data.transformations.min_max
            _partial_: true
            stats:
              _target_: data.statistics.read_statistics_var
              path: ${preparation.statistics.data.output.path}
              var: 'lat'
              dtype: ${data.dtype}
  # Validation set
  valid:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Latitude
      lat:
        # Dataset class
        _target_: ${data.stage.train.variables.lat._target_}
        _recursive_: false
        # Path to the latitude data file
        path: ${....dir}/lat.npy
        # Type of data
        type: ${data.stage.train.variables.lat.type}
        # Loading function
        load:
          _target_: ${data.stage.train.variables.lat.load._target_}
          path: ${..path}
          scans:
            _target_: ${....scans.load._target_}
            path: ${....scans.load.path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations: ${data.stage.train.variables.lat.transformations}
  # Test set
  test:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Latitude
      lat:
        # Dataset class
        _target_: ${data.stage.train.variables.lat._target_}
        _recursive_: false
        # Path to the latitude data file
        path: ${....dir}/lat.npy
        # Type of data
        type: ${data.stage.train.variables.lat.type}
        # Loading function
        load:
          _target_: ${data.stage.train.variables.lat.load._target_}
          path: ${..path}
          scans:
            _target_: ${....scans.load._target_}
            path: ${....scans.load.path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations: ${data.stage.train.variables.lat.transformations}
  # Predict set
  predict:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Latitude
      lat: ${...test.variables.lat}
  # Source data (complete dataset)
  source:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Latitude
      lat:
        # Type of data
        type: ${data.stage.train.variables.lat.type}
        # Loading function
        load:
          _target_: numpy.concatenate
          _args_:
            - - ${data.stage.train.variables.lat.load}
              - ${data.stage.valid.variables.lat.load}
              - ${data.stage.test.variables.lat.load}
            - 0
        # Transformations to apply
        transformations: ${data.stage.train.variables.lat.transformations}