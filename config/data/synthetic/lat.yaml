# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Latitude
    lat:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Path to the latitude data file
      path: ${...dir}/lat.npy
      # Type of data
      type: 'Latitude (degrees)'
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations:
        # Per-variable normalization
        normalization:
          _target_: code.data.transformations.min_max
          _partial_: true
          stats:
            _target_: code.preprocessing.statistics.read_statistics_var
            path: ${preprocessing.statistics.data.output.path}
            key: 'lat'
            dtype: ${data.dtype}
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Latitude
    lat:
      # Dataset class
      _target_: ${....train.variables.lat._target_}
      _recursive_: false
      # Path to the latitude data file
      path: ${...dir}/lat.npy
      # Type of data
      type: ${....train.variables.lat.type}
      # Loading function
      load:
        _target_: ${.....train.variables.lat.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.lat.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Latitude
    lat:
      # Dataset class
      _target_: ${....train.variables.lat._target_}
      _recursive_: false
      # Path to the latitude data file
      path: ${...dir}/lat.npy
      # Type of data
      type: ${....train.variables.lat.type}
      # Loading function
      load:
        _target_: ${.....train.variables.lat.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.lat.transformations}
# Predict set
predict:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Latitude
    lat: ${...test.variables.lat}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Latitude
    lat:
      # Type of data
      type: ${....train.variables.lat.type}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${.......train.variables.lat.load}
            - ${.......valid.variables.lat.load}
            - ${.......test.variables.lat.load}
          - 0
      # Transformations to apply
      transformations: ${....train.variables.lat.transformations}