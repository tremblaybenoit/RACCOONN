# Format:
#   stage:
#   -- source: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from source and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.
stage:
  # Training set
  train:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Observations
      obs: &train
        # Dataset class
        _target_: forward.model.data_loader.TorchDataset
        _recursive_: false
        # Path to the observations file
        path: ${....dir}/obs.npy
        # Type of data
        type: 'Observations (no units)'
        # Loading function
        load:
          _target_: data.io.load_npy
          path: ${..path}
          split: ${....split}
          dtype: ${data.dtype}
        # Transformations to apply
        transformations:
          # Per-variable normalization
          normalization:
            _target_: data.transformations.identity
            _partial_: true
            stats:
              _target_: data.statistics.read_statistics_var
              path: ${preparation.statistics.data.output.path}
              var: 'obs'
              dtype: ${data.dtype}
  # Validation set
  valid:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Observations
      obs:
        <<: *train
  # Test set
  test:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Observations
      obs:
        <<: *train
  # Predict set
  predict: ${..test}
  # Source data (complete dataset)
  source:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Observations
      obs:
        # Type of data
        type: ${data.stage.train.variables.obs.type}
        # Loading function
        load:
          _target_: numpy.concatenate
          _args_:
            - - ${data.stage.train.variables.obs.load}
              - ${data.stage.valid.variables.obs.load}
              - ${data.stage.test.variables.obs.load}
            - 0
        # Transformations to apply
        transformations: ${data.stage.train.variables.obs.transformations}

