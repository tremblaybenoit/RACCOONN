# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    bt_forward:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${paths.run_dir}/bt_forward_train.npy
      # Channels
      type: ${..bt_crtm.type}
      # Number of variables
      n: ${..bt_crtm.n}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: code.data.io.save_npy
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations:
        # Per-variable normalization
        normalization:
          _target_: code.data.transformations.min_max
          _partial_: true
          stats:
            _target_: code.preprocessing.statistics.read_statistics_var
            load: ${preprocessing.statistics.output.load}
            key: 'bt_crtm'
            dtype: ${data.dtype}
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    bt_forward:
      # Dataset class
      _target_: ${....train.variables.bt_forward._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${paths.run_dir}/bt_forward_valid.npy
      # Channels
      type: ${....train.variables.bt_forward.type}
      # Number of variables
      n: ${....train.variables.bt_forward.n}
      # Loading function
      load:
        _target_: ${.....train.variables.bt_forward.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: ${.....train.variables.bt_forward.save._target_}
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.bt_forward.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    bt_forward:
      # Dataset class
      _target_: ${....train.variables.bt_forward._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/bt_forward_test.npy
      # Channels
      type: ${....train.variables.bt_forward.type}
      # Number of variables
      n: ${....train.variables.bt_forward.n}
      # Loading function
      load:
        _target_: ${.....train.variables.bt_forward.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: ${.....train.variables.bt_forward.save._target_}
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.bt_forward.transformations}
# Predict set
predict:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    bt_forward:
      # Dataset class
      _target_: ${....train.variables.bt_forward._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/bt_forward_predict.npy
      # Channels
      type: ${....train.variables.bt_forward.type}
      # Number of variables
      n: ${....train.variables.bt_forward.n}
      # Loading function
      load:
        _target_: ${.....train.variables.bt_forward.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Save function
      save:
        _target_: ${.....train.variables.bt_forward.save._target_}
        _partial_: true
        _args_:
          - ${...path}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.bt_forward.transformations}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    bt_forward:
      # Dataset class
      _target_: ${....train.variables.bt_forward._target_}
      _recursive_: false
      # Channels
      type: ${....train.variables.bt_forward.type}
      # Number of variables
      n: ${....train.variables.bt_forward.n}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${.......train.variables.bt_forward.load}
            - ${.......valid.variables.bt_forward.load}
            - ${.......test.variables.bt_forward.load}
          - 0
      # Transformations to apply
      transformations: ${....train.variables.bt_forward.transformations}