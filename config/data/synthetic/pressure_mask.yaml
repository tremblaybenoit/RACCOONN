# Format:
#   -- source: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from source and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Source data (complete dataset)
source:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Pressure mask
    pressure_mask:
      # Dataset class
      _target_: code.loader.dataset.ConstantDataset
      _recursive_: false
      # Type of data
      type: 'Pressure mask'
      # Path to the pressure mask file
      path: ${preprocessing.filters.pressure_mask.output.path}
      # Loading function
      load: ${preprocessing.filters.pressure_mask.output.load}
# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Pressure mask
    pressure_mask: ${...source.variables.pressure_mask}
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Pressure mask
    pressure_mask: ${...source.variables.pressure_mask}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Pressure mask
    pressure_mask: ${...source.variables.pressure_mask}
# Predict set
predict:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Pressure mask
    pressure_mask: ${...source.variables.pressure_mask}