# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Pressure mask
    pressure_mask:
      # Dataset class
      _target_: code.loader.dataset.ConstantDataset
      _recursive_: false
      # Type of data
      type: 'Pressure mask'
      # Loading function
      load:
        _target_: code.preprocessing.filters.pressure_mask
        # Statistics of the pressure variable to compute the mask
        stats:
          _target_: code.data.preprocessing.statistics.read_statistics_var
          load: ${preprocessing.statistics.data.output.load}
          key: 'pressure'
          dtype: ${data.dtype}
        # Ratio threshold to determine constant pressure levels
        threshold: 0.005
# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Pressure mask
    pressure_mask: ${...all.variables.pressure_mask}
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Pressure mask
    pressure_mask: ${...all.variables.pressure_mask}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Pressure mask
    pressure_mask: ${...all.variables.pressure_mask}
# Predict set
predict:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Pressure mask
    pressure_mask: ${...all.variables.pressure_mask}