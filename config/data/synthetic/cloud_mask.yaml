# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Cloud mask
    cloud_mask:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Type of data
      type: 'Cloud mask'
      # Path to the cloud mask file
      path: ${paths.data_dir}/cloud_mask.npy
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        split: ${....split}
        dtype: bool
      # Save function
      save:
        _target_: code.data.io.save_npy
        _partial_: true
        _args_:
          - ${....path}
        dtype: bool
      # Transformations to apply
      transformations: null
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Cloud mask
    cloud_mask:
      # Dataset class
      _target_: ${...train.variables.cloud_mask._target_}
      _recursive_: false
      # Type of data
      type: ${....train.variables.cloud_mask.type}
      # Loading function
      load:
        _target_: ${.....train.variables.cloud_mask.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: bool
      # Save function
      save:
        _target_: ${.....train.variables.cloud_mask.save._target_}
        _partial_: true
        _args_:
          - ${....path}
        dtype: bool
      # Transformations to apply
      transformations: ${....train.variables.cloud_mask.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Cloud mask
    cloud_mask:
      # Dataset class
      _target_: ${....train.variables.cloud_mask._target_}
      _recursive_: false
      # Type of data
      type: ${....train.variables.cloud_mask.type}
      # Loading function
      load:
        _target_: ${.....train.variables.cloud_mask.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: bool
      # Save function
      save:
        _target_: ${.....train.variables.cloud_mask.save._target_}
        _partial_: true
        _args_:
          - ${....path}
        dtype: bool
      # Transformations to apply
      transformations: ${....train.variables.cloud_mask.transformations}
# Predict set
predict:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Cloud mask
    cloud_mask: ${...test.variables.cloud_mask}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Dataset class
    _target_: ${....train.variables.cloud_mask._target_}
    _recursive_: false
    # Cloud mask
    cloud_mask:
      # Type of data
      type: ${....train.variables.cloud_mask.type}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${.......train.variables.cloud_mask.load}
            - ${.......valid.variables.cloud_mask.load}
            - ${.......test.variables.cloud_mask.load}
          - 0
      # Transformations to apply
      transformations: null