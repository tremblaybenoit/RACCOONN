# Format:
#   stage:
#   -- source: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from source and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.
stage:
  # Training set
  train:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Atmospheric profiles
      prof_prior: &train
        # Dataset class
        _target_: forward.model.data_loader.TorchDataset
        _recursive_: false
        # Path to the atmospheric profiles file
        path: null
        # Profile types
        type: ['Air temperature', 'Cloud ice particle effective radius', 'Cloud water particle effective radius',
               'Snow particle effective radius', 'Humidity mixing ratio', 'Cloud ice mass', 'Cloud water mass',
               'Snow mass', 'Ozone mixing ratio']
        # Loading function
        load:
          _target_: data.covariance.prior_from_bounded_perturbations
          stats: ${....prof.transformations.normalization.stats}
          seed: 75
          # What the method needs as input
          input:
            # Cholesky matrix
            cholesky: ${preparation.covariance.B_uni_stdn_temporal.output.cholesky}
        # Transformations to apply
        transformations: ${...prof.transformations}
  # Validation set
  valid:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Atmospheric profiles
      prof_prior:
        <<: *train
        # Loading function
        load:
          seed: 48
  # Test set
  test:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Atmospheric profiles
      prof_prior:
        <<: *train
        # Loading function
        load:
          seed: 15
  # Predict set
  predict: ${..test}
  # Source data (complete dataset)
  source:
    # Variable-specific configuration, keyed by variable name for potential multi-variable support.
    variables:
      # Atmospheric profiles
      prof_prior:
        # Type of the atmospheric profiles
        type: ${data.stage.train.variables.prof_prior.type}
        # Loading function
        load:
          _target_: numpy.concatenate
          _args_:
            - - ${data.stage.train.variables.prof_prior.load}
              - ${data.stage.valid.variables.prof_prior.load}
              - ${data.stage.test.variables.prof_prior.load}
            - 0
        # Transformations to apply
        transformations: ${data.stage.train.variables.prof_prior.transformations}

