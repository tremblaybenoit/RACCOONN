defaults:
  - synthetic/default@stage
  - synthetic/default@source
# dtype
dtype: 'float32'

# Variables to use as input/output
select_input: ['prof', 'meta', 'surf']
select_target: ['hofx']
select_context: ['clear_mask', 'cloud_mask', 'daytime_mask']

# Original data - Split the data into training, validation, and test sets
source:
  # Training set
  train:
    # Path to training data
    dir: ../synthetic_float32_cloud/Train2
    # Split
    split: null

  # Validation set
  valid:
    # Path to validation data
    dir: ../synthetic_float32_cloud/Val2
    # Split
    split: null

  # Test set
  test:
    # Path to test data
    dir: ../synthetic_float32_cloud/Test2
    # Split
    split: null

  # Prediction set (NOTE: By default, we use the test set as the prediction set for demonstration purposes)
  predict:
    # Path to prediction data
    dir: ${data.source.test.dir}
    # Split
    split: ${data.source.test.split}

# Split the data into training, validation, and test sets
stage:
  # Training set
  train:
    # Path to training data
    dir: ${paths.data_dir}/Train2
    # Split
    split: null

  # Validation set
  valid:
    # Path to validation data
    dir: ${paths.data_dir}/Val2
    # Split
    split: null

  # Test set
  test:
    # Path to test data
    dir: ${paths.data_dir}/Test2
    # Split
    split: null

  # Prediction set (NOTE: By default, we use the test set as the prediction set for demonstration purposes)
  predict:
    # Path to prediction data
    dir: ${data.stage.test.dir}
    # Split
    split: ${data.stage.test.split}