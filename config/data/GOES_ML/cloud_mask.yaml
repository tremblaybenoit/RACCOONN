# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Cloud mask
    cloud_mask:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Type of data
      type: 'Cloud mask'
      # Loading function (cloud filter is computed, not loaded directly)
      load:
        _target_: code.preprocessing.filters.cloud_mask
        _args_:
          - ${....prof.load}
      # Transformations to apply
      transformations: null
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Cloud mask
    cloud_mask:
      # Dataset class
      _target_: ${....train.variables.cloud_mask._target_}
      _recursive_: false
      # Type of data
      type: ${....train.variables.cloud_mask.type}
      # Loading function (cloud filter is computed, not loaded directly)
      load:
        _target_: ${.....train.variables.cloud_mask.load._target_}
        _args_:
          - ${....prof.load}
      # Transformations to apply
      transformations: ${....train.variables.cloud_mask.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Cloud mask
    cloud_mask:
      # Dataset class
      _target_: ${....train.variables.cloud_mask._target_}
      _recursive_: false
      # Type of data
      type: ${....train.variables.cloud_mask.type}
      # Loading function (cloud filter is computed, not loaded directly)
      load:
        _target_: ${.....train.variables.cloud_mask.load._target_}
        _args_:
          - ${....prof.load}
      # Transformations to apply
      transformations: ${....train.variables.cloud_mask.transformations}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Cloud mask
    cloud_mask:
      # Dataset class
      _target_: ${....train.variables.cloud_mask._target_}
      _recursive_: false
      # Type of data
      type: ${....train.variables.cloud_mask.type}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${.......train.variables.cloud_mask.load}
            - ${.......valid.variables.cloud_mask.load}
            - ${.......test.variables.cloud_mask.load}
          - 0
      # Transformations to apply
      transformations: null