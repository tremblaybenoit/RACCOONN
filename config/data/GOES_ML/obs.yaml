# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Observations
    obs:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Path to the observations file
      path: ${...dir}/obs.npy
      # Type of data
      type: 'Observations (no units)'
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: null
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Observations
    obs:
      # Dataset class
      _target_: ${....train.variables.obs._target_}
      _recursive_: false
      # Path to the observations file
      path: ${...dir}/obs.npy
      # Type of data
      type: ${....train.variables.obs.type}
      # Loading function
      load:
        _target_: ${.....train.variables.obs.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.obs.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Observations
    obs:
      # Dataset class
      _target_: ${....train.variables.obs._target_}
      _recursive_: false
      # Path to the observations file
      path: ${...dir}/obs.npy
      # Type of data
      type: ${....train.variables.obs.type}
      # Loading function
      load:
        _target_: ${.....train.variables.obs.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.obs.transformations}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Observations
    obs:
      # Dataset class
      _target_: ${....train.variables.obs._target_}
      _recursive_: false
      # Type of data
      type: ${....train.variables.obs.type}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${.......train.variables.obs.load}
            - ${.......valid.variables.obs.load}
            - ${.......test.variables.obs.load}
          - 0
      # Transformations to apply
      transformations: ${....train.variables.obs.transformations}

