# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Atmospheric profiles
    prof:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Path to the atmospheric profiles file
      path: ${...dir}/prof.npy
      # Profile types
      type: ['Air temperature', 'Cloud ice particle effective radius', 'Cloud water particle effective radius',
             'Snow particle effective radius', 'Humidity mixing ratio', 'Cloud ice mass', 'Cloud water mass',
             'Snow mass', 'Ozone mixing ratio']
      # Number of variables
      n:
        _target_: builtins.len
        _args_:
          - ${...type}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations:
        # Per-variable normalization
        normalization:
          # Function
          _target_: code.data.transformations.NormalizeProfiles
          # Min/max values for normalization
          profmin:
            _target_: numpy.loadtxt
            _args_:
              - data/normalization/prof_m.txt
          profmax:
            _target_: numpy.loadtxt
            _args_:
              - data/normalization/prof_div.txt
          dtype: ${data.dtype}
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Atmospheric profiles
    prof:
      # Dataset class
      _target_: ${....train.variables.prof._target_}
      _recursive_: false
      # Path to the atmospheric profiles file
      path: ${...dir}/prof.npy
      # Profile types
      type: ${....train.variables.prof.type}
      # Number of variables
      n: ${....train.variables.prof.n}
      # Loading function
      load:
        _target_: ${.....train.variables.prof.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.prof.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Atmospheric profiles
    prof:
      # Dataset class
      _target_: ${....train.variables.prof._target_}
      _recursive_: false
      # Path to the atmospheric profiles file
      path: ${...dir}/prof.npy
      # Profile types
      type: ${....train.variables.prof.type}
      # Number of variables
      n: ${....train.variables.prof.n}
      # Loading function
      load:
        _target_: ${.....train.variables.prof.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.prof.transformations}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # Atmospheric profiles
    prof:
      # Dataset class
      _target_: ${....train.variables.prof._target_}
      _recursive_: false
      # Type of the atmospheric profiles
      type: ${....train.variables.prof.type}
      # Number of variables
      n: ${....train.variables.prof.n}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${.......train.variables.prof.load}
            - ${.......valid.variables.prof.load}
            - ${.......test.variables.prof.load}
          - 0
      # Transformations to apply
      transformations: ${....train.variables.prof.transformations}
