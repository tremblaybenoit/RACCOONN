# Format:
#   -- all: common configuration for all stages (train/valid/test/predict)
#   -- train/valid/test: stage-specific configuration, inheriting from all and overriding as

# Stage-specific settings (e.g., file splits, wavelengths, variables). Predict stage can simply reference test stage if identical.

# Training set
train:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    bt_crtm:
      # Dataset class
      _target_: code.loader.dataset.EagerDataset
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/hofx.npy
      # Channels
      type: [
        'Channel 7', 'Channel 8', 'Channel 9', 'Channel 10', 'Channel 11', 'Channel 12',
        'Channel 13', 'Channel 14', 'Channel 15', 'Channel 16'
      ]
      # Number of variables
      n:
        _target_: builtins.len
        _args_:
          - ${...type}
      # Loading function
      load:
        _target_: code.data.io.load_npy
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: null
# Validation set
valid:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    bt_crtm:
      # Dataset class
      _target_: ${....train.variables.bt_crtm._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/hofx.npy
      # Channels
      type: ${....train.variables.bt_crtm.type}
      # Number of variables
      n: ${....train.variables.bt_crtm.n}
      # Loading function
      load:
        _target_: ${.....train.variables.bt_crtm.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.bt_crtm.transformations}
# Test set
test:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    bt_crtm:
      # Dataset class
      _target_: ${....train.variables.bt_crtm._target_}
      _recursive_: false
      # Path to the HOFX (simulated observations) file
      path: ${...dir}/hofx.npy
      # Channels
      type: ${....train.variables.bt_crtm.type}
      # Number of variables
      n: ${....train.variables.bt_crtm.n}
      # Loading function
      load:
        _target_: ${.....train.variables.bt_crtm.load._target_}
        path: ${..path}
        split: ${....split}
        dtype: ${data.dtype}
      # Transformations to apply
      transformations: ${....train.variables.bt_crtm.transformations}
# All data (complete dataset)
all:
  # Variable-specific configuration, keyed by variable name for potential multi-variable support.
  variables:
    # HOFX (Simulated Observations)
    bt_crtm:
      # Dataset class
      _target_: ${....train.variables.bt_crtm._target_}
      _recursive_: false
      # Channels
      type: ${....train.variables.bt_crtm.type}
      # Number of variables
      n: ${....train.variables.bt_crtm.n}
      # Loading function
      load:
        _target_: numpy.concatenate
        _args_:
          - - ${.......train.variables.bt_crtm.load}
            - ${.......valid.variables.bt_crtm.load}
            - ${.......test.variables.bt_crtm.load}
          - 0
      # Transformations to apply
      transformations: ${....train.variables.bt_crtm.transformations}