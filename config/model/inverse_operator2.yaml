# Model
_target_: inverse.model.model.PINNverseOperator0
_recursive_: false

# Optimizer function and parameters
optimizer:
  # Function
  _target_: torch.optim.Adam
  # Learning rate
  lr: 0.0005
  # Weight decay (L2 regularization)
  weight_decay: 0.000

# Learning rate scheduler
lr_scheduler:
  # Function
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  # Mode for the scheduler
  mode: min
  # Factor to reduce the learning rate
  factor: 0.5
  # Number of epochs with no improvement after which learning rate will be reduced
  patience: 3
  # Minimum learning rate
  min_lr: 1.0e-6
  # Threshold for measuring the new optimum, to only focus on significant changes
  threshold: 0.0
  threshold_mode: abs

# Model parameters associated with the data (e.g., input/output dimensions) and architecture
parameters:
  # Data parameters
  data:
    # Number of variables
    n_lat: 1
    n_lon: 1
    n_scans: 1
    n_prof: 9
    n_levels: 1
    n_pressure: 1
    n_cloud: 0
    # Profile variables (input/output)
    prof_vars: ${data.stage.train.vars.prof.type}
  # Model architecture
  architecture:
    # Number of neurons in the hidden layers
    n_neurons: 64
    # Number of hidden layers
    n_layers: 4
    # Dropout rate
    dropout: 0.1

# Loss function and parameters
loss_func:
  # Function
  _target_: inverse.model.loss.VarLoss # Load loss function
  # Forward model to compute the model equivalent of the observations
  forward_model:
    # Function
    _target_: inverse.model.loss.ForwardModel
    # Precision
    dtype: ${data.dtype}
    # Normalization for the profile variables
    prof_norm: null
  # Weights for observation (obs), model, and boundary condition (bcs) errors
  lambda_obs: 0.
  lambda_model: 1.
  lambda_bcs: 1.
  # Loss term for observations
  loss_obs:
    _target_: inverse.model.loss.MSE
  # Loss term for model variables
  loss_model:
    _target_: inverse.model.loss.MSE
  # Loss term for boundary conditions
  loss_bcs:
    _target_: inverse.model.loss.MSE
  # Pressure filter: Consider only pressure levels with non-zero variance (for model and bcs errors)
  pressure_filter:  ${data.pressure_filter.load}

# Positional encoding
positional_encoding:
  _target_: inverse.model.encoding.IdentityPositionalEncoding
  d_input:
    _target_: numpy.sum
    _args_:
      -
        - ${model.parameters.data.n_lat}
        - ${model.parameters.data.n_lon}
        - ${model.parameters.data.n_scans}
        - ${model.parameters.data.n_pressure}
        - ${model.parameters.data.n_cloud}

# Input layer
input_layer:
  _target_: inverse.model.model.LinearBlock
  in_features:
    _target_: numpy.sum
    _args_:
      -
        - ${model.parameters.data.n_lat}
        - ${model.parameters.data.n_lon}
        - ${model.parameters.data.n_scans}
        - ${model.parameters.data.n_pressure}
        - ${model.parameters.data.n_cloud}
  out_features: ${model.parameters.architecture.n_neurons}
  layernorm:
    _target_: torch.nn.Identity
  activation:
    _target_: forward.model.activation.Sine
    w0: 30.0
  dropout_rate: ${model.parameters.architecture.dropout}
  init_func:
    _target_: inverse.model.model.SirenInit
    is_first_layer: true
    activation: ${model.input_layer.activation}

# Hidden layer
hidden_layer:
  _target_: inverse.model.model.LinearBlock
  in_features: ${model.parameters.architecture.n_neurons}
  out_features: ${model.parameters.architecture.n_neurons}
  layernorm: ${model.input_layer.layernorm}
  activation: ${model.input_layer.activation}
  dropout_rate: ${model.parameters.architecture.dropout}
  init_func:
    _target_: inverse.model.model.SirenInit
    is_first_layer: false
    activation: ${model.hidden_layer.activation}

# Output layer
output_layer:
  _target_: inverse.model.model.LinearBlock
  in_features: ${model.parameters.architecture.n_neurons}
  out_features:
    _target_: builtins.int
    _args_:
      -
        _target_: numpy.multiply
        _args_:
          - ${model.parameters.data.n_prof}
          - ${model.parameters.data.n_levels}
  layernorm: ${model.input_layer.layernorm}
  activation:
    _target_: torch.nn.Sigmoid
  dropout_rate: 0.0
  init_func:
    _target_: inverse.model.model.SirenInit
    is_first_layer: false
    is_head: true
    activation: ${model.output_layer.activation}