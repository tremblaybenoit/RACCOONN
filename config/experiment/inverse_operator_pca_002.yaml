# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: inverse_recast
  - override /preparation: inverse_default
  - override /loader: inverse_cs
  - override /model: inverse_operator
  - override /trainer: gpu
  - override /callbacks: inverse_default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "inverse_operator_pca"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../inverse_outputs"
  run_id: "pca_002"
  data_dir: ../data_${data.dtype}_cs

# Trainer configuration
trainer:
  min_epochs: 1  # To prevent early stopping
  max_epochs: 64  # Number of epochs
  precision: 32  # 32-bit precision

# Initialization
# init_from_checkpoint: inverse/model/checkpoints/model_bg_200.ckpt

# Callbacks
callbacks:
  early_stopping:
    patience: 10  # Number of epochs with no improvement after which training will be stopped

# Preparation configuration
preparation:
  # Statistics computation
  statistics:
    # Variables for which to compute statistics
    data:
      # Output path for statistics
      output:
        path: ${paths.data_dir}/normalization/statistics.pkl
  # Covariance computation
  covariance:
    # Error covariance matrix in model space
    B:
      # Output path for covariance matrix B
      output:
        path: ${paths.data_dir}/normalization/covariance_matrix_B_inverse.npy
    # Error covariance matrix in observation space
    R:
      # Output path for covariance matrix R
      output:
        path: ${paths.data_dir}/normalization/covariance_matrix_R_inverse.npy
  # PCA decomposition
  pca:
    # Atmospheric profiles
    prof:
      # Function
      _target_: data.pca.compute_pca
      _recursive_: false  # Do not instantiate nested objects
      # What the method needs as input
      input:
        # Profile data to compute PCA on
        data:
          load:
            _target_: data.io.load_stack_and_normalize
            _recursive_: false
            stack:
              - ${data.stage.train.vars.prof}
              - ${data.stage.valid.vars.prof}
              - ${data.stage.test.vars.prof}
        n_comp: 270
      # What the method produces as output (pickle file)
      output:
        # File path to save/load the PCA object
        path: ${paths.data_dir}/normalization/pca.pkl
        # Save function
        save:
          _target_: data.io.save_pkl
          _partial_: true
          _args_:
            - ${preparation.pca.prof.output.path}
        # Load function
        load:
          _target_: data.io.load_pkl
          _args_:
            - ${preparation.pca.prof.output.path}

# Data configuration
data:
  # Precision
  dtype: 'float32'
  # Split ratios for training, validation, and test sets
  stage:
    # Training set
    train:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Normalization function and parameters
          normalization:
            _target_: data.transformations.min_max
            _partial_: true
            stats:
              _target_: data.statistics.read_statistics_var
              path: ${preparation.statistics.data.output.path}
              var: 'prof'
              dtype: ${data.dtype}
            axis: 1
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_pca1.npy
            split: ${....split}
            dtype: ${data.dtype}
        # Profile background
        prof_white_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/pca_prof_background.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        # Atmospheric profile increment
        prof_white_increment:
          # Loading function
          load:
            _target_: data.pca.load_pca_buffers
            path: ${preparation.pca.prof.output.path}
            buffer: 'sym_log_z_std'
          normalization: null
    # Validation set
    valid:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Normalization function and parameters
          normalization:
            _target_: data.transformations.min_max
            _partial_: true
            stats:
              _target_: data.statistics.read_statistics_var
              path: ${preparation.statistics.data.output.path}
              var: 'prof'
              dtype: ${data.dtype}
            axis: 1
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_pca1.npy
            split: ${....split}
            dtype: ${data.dtype}
        # Profile background
        prof_white_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/pca_prof_background.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        # Atmospheric profile increment
        prof_white_increment:
          # Loading function
          load:
            _target_: data.pca.load_pca_buffers
            path: ${preparation.pca.prof.output.path}
            buffer: 'sym_log_z_std'
          normalization: null
    # Test set
    test:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Normalization function and parameters
          normalization:
            _target_: data.transformations.min_max
            _partial_: true
            stats:
              _target_: data.statistics.read_statistics_var
              path: ${preparation.statistics.data.output.path}
              var: 'prof'
              dtype: ${data.dtype}
            axis: 1
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_pca1.npy
            split: ${....split}
            dtype: ${data.dtype}
        # Profile background
        prof_white_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/pca_prof_background.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        # Atmospheric profile increment
        prof_white_increment:
          # Loading function
          load:
            _target_: data.pca.load_pca_buffers
            path: ${preparation.pca.prof.output.path}
            buffer: 'sym_log_z_std'
          normalization: null

# Loader configuration
loader:
  batch_size: 96
  num_workers: 10
  persistent_workers: true
  pin_memory: true
  stage:
    train:
      target:
        prof_white_background: ${data.stage.train.vars.prof_white_background}
        prof_white_increment: ${data.stage.train.vars.prof_white_increment}
    valid:
      target:
        prof_white_background: ${data.stage.valid.vars.prof_white_background}
        prof_white_increment: ${data.stage.valid.vars.prof_white_increment}
    test:
      target:
        prof_white_background: ${data.stage.test.vars.prof_white_background}
        prof_white_increment: ${data.stage.test.vars.prof_white_increment}

# Model parameters
model:
  # Model
  _target_: inverse.model.model.PINNverseOperatorPCA
  pca_buffers:
    # Load PCA buffers
    _target_: data.pca.load_pca_buffers
    path: ${preparation.pca.prof.output.path}
  # Optimizer function and parameters
  optimizer:
    # Learning rate
    lr: 0.0005
    # Weight decay (L2 regularization)
    weight_decay: 0
  # Learning rate scheduler
  lr_scheduler:
    # Function
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    # Mode for the scheduler
    mode: min
    # Factor to reduce the learning rate
    factor: 0.2
    # Number of epochs with no improvement after which learning rate will be reduced
    patience: 3
    # Minimum learning rate
    min_lr: 1.0e-6
    # Threshold for measuring the new optimum, to only focus on significant changes
    threshold: 0.0
    threshold_mode: abs
  # Model parameters associated with the data (e.g., input/output dimensions) and architecture
  parameters:
    # Model architecture
    architecture:
      # Number of neurons in the hidden layers
      n_neurons: 128
      # Number of hidden layers
      n_layers: 2
      # Dropout rate
      dropout: 0.1
    # Data
    data:
      n_prof: 3  # Number of profile variables
  # Loss function and parameters
  loss_func:
    # Function
    _target_: inverse.model.loss2.VarLoss # Load loss function
    # Forward model to compute the model equivalent of the observations
    forward_model:
      # Function
      _target_: inverse.model.loss2.ForwardModel
    # Weights for observation (obs), model, and boundary condition (bcs) errors
    lambda_obs: 0
    lambda_model: 1.
    lambda_bcs: 1.
    clear_sky: true
    # Loss term for observations
    loss_obs:
      # _target_: inverse.model.loss.MSE
      _target_: inverse.model.loss2.DiagonalQuadraticForm
    # Loss term for model variables
    loss_model:
      _target_: inverse.model.loss2.DiagonalQuadraticForm
    # Loss term for boundary conditions
    loss_bcs:
      _target_: inverse.model.loss2.MSE
    # Pressure filter: Consider only pressure levels with non-zero variance (for model and bcs errors)
    # pressure_filter: ${data.pressure_filter.load}
    # Prediction profile: Use full profile for loss computation
  # Positional encoding
  positional_encoding:
    _target_: inverse.model.encoding.MultiScaleGaussianEncoding
    num_freqs: 20
    d_input: 4
    # [Lat, Lon, Scans, Pressure]
    sigma_per_dim: [ 1.0, 1.0, 0.5]
  # Activation functions (input layer/within the network)
  activation_in:
    _target_: forward.model.activation.Sine
  # Activation function (output layer)
  activation_out:
    _target_: inverse.model.activation.ScaledTanh
    limit: 4.0

# Logger configuration
logger:
  # MLflow logger
  ports:
    mlflow: 5007