# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: inverse_recast
  - override /preparation: inverse_pca
  - override /loader: inverse_static
  - override /model: inverse_operator_pca
  - override /trainer: gpu
  - override /callbacks: inverse_default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "inverse_operator_static_pca_cs"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../inverse_outputs"
  run_id: "4014"
  data_dir: ../static_${data.dtype}_cs

# Trainer configuration
trainer:
  min_epochs: 1  # To prevent early stopping
  max_epochs: 1960  # Number of epochs
  precision: 32  # 32-bit precision

# Initialization
# init_from_checkpoint: ../inverse_outputs/inverse_operator_static_pca_cs/checkpoints/model.ckpt
# init_from_checkpoint: inverse_outputs/model/checkpoints/model_swish_background.ckpt

# Callbacks
callbacks:
  early_stopping:
    patience: 101  # Number of epochs with no improvement after which training will be stopped

# Preparation configuration
preparation:
  # Statistics computation
  statistics:
    # Variables for which to compute statistics
    data:
      # Output path for statistics
      output:
        path: ${paths.data_dir}/normalization/statistics.pkl
  # PCA decomposition
  pca:
    # Atmospheric profiles
    prof:
      # Function
      _target_: data.pca.compute_pca
      _recursive_: false  # Do not instantiate nested objects
      # What the method needs as input
      input:
        n_comp: 270

# Data configuration
data:
  # Precision
  dtype: 'float32'
  # Split ratios for training, validation, and test sets
  stage:
    # Training set
    train:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Profile types
          type: ['Air temperature', 'Humidity mixing ratio', 'Ozone mixing ratio']
          # Normalization function and parameters
          normalization:
            _target_: data.transformations.min_max
            _partial_: true
            stats:
              _target_: data.statistics.read_statistics_var
              path: ${preparation.statistics.data.output.path}
              var: 'prof'
              dtype: ${data.dtype}
            axis: 1
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_v3_smooth_cs.npy
        # Atmospheric profiles
        prof_background:
          normalization: ${data.stage.train.vars.prof.normalization}
        # Profile whitened
        prof_white:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        # Profile background
        prof_white_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof_background.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        # Atmospheric profile increment
        prof_white_increment:
          # Loading function
          load:
            _target_: data.pca.load_pca_buffers
            path: ${paths.data_dir}/normalization/pca.pkl
            buffer: 'scales_inv'
          normalization: null
    # Validation set
    valid:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Profile types
          type: ${data.stage.train.vars.prof.type}
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_v3_smooth_cs.npy
        # Atmospheric profiles
        prof_background:
          normalization: ${data.stage.train.vars.prof.normalization}
        # Profile whitened
        prof_white:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        # Profile background
        prof_white_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof_background.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        # Atmospheric profile increment
        prof_white_increment:
          # Loading function
          load:
            _target_: data.pca.load_pca_buffers
            path: ${paths.data_dir}/normalization/pca.pkl
            buffer: 'scales_inv'
          normalization: null
    # Test set
    test:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Profile types
          type: ${data.stage.train.vars.prof.type}
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_v3_smooth_cs.npy
        # Atmospheric profiles
        prof_background:
          normalization: ${data.stage.train.vars.prof.normalization}
        # Profile whitened
        prof_white:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        # Profile background
        prof_white_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof_background.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        # Atmospheric profile increment
        prof_white_increment:
          # Loading function
          load:
            _target_: data.pca.load_pca_buffers
            path: ${paths.data_dir}/normalization/pca.pkl
            buffer: 'scales_inv'
          normalization: null

# Loader configuration
loader:
  batch_size: 24
  num_workers: 10
  stage:
    train:
      target:
        prof_white: ${data.stage.train.vars.prof_white}
        prof_white_background: ${data.stage.train.vars.prof_white_background}
        prof_white_increment: ${data.stage.train.vars.prof_white_increment}
    valid:
      target:
        prof_white: ${data.stage.valid.vars.prof_white}
        prof_white_background: ${data.stage.valid.vars.prof_white_background}
        prof_white_increment: ${data.stage.valid.vars.prof_white_increment}
    test:
      target:
        prof_white: ${data.stage.test.vars.prof_white}
        prof_white_background: ${data.stage.test.vars.prof_white_background}
        prof_white_increment: ${data.stage.test.vars.prof_white_increment}

# Model parameters
model:
  pca_buffers:
    # Load PCA buffers
    _target_: data.pca.load_pca_buffers
    path: ${paths.data_dir}/normalization/pca.pkl
  # Optimizer function and parameters
  optimizer:
    # Learning rate
    lr: 0.001
    # Weight decay (L2 regularization)
    weight_decay: 0
  # Learning rate scheduler
  lr_scheduler:
    # Factor to reduce the learning rate
    factor: 0.75
    # Number of epochs with no improvement after which learning rate will be reduced
    patience: 25
  # Model parameters associated with the data (e.g., input/output dimensions) and architecture
  parameters:
    # Number of variables
    n_scans: 0
  # Loss function and parameters
  loss_func:
    # Function
    _target_: inverse.model.loss.VarLossHybridPCA # Load loss function
    # Forward model to compute the model equivalent of the observations
    forward_model:
      # Function
      _target_: inverse.model.loss.ForwardModel
      # Configuration of the forward model
      checkpoint_path: 'forward/model/checkpoints/model_v3_smooth_cs.ckpt'
      config_path: 'model/forward_emulator_smooth_cs.yaml'
      # Precision
      dtype: ${data.dtype}
      # Normalization for the profile variables
      prof_norm: null
    # Weights for observation (obs), model, and boundary condition (bcs) errors
    lambda_obs: 1.
    lambda_model: 1.
    lambda_bcs: 1.
    lambda_sobolev: 1.e-5
    clear_sky: false
    # Loss term for observations
    loss_obs:
      _target_: inverse.model.loss.MSE
    # Loss term for model variables
    loss_model:
      _target_: inverse.model.loss.MSE
    # Loss term for boundary conditions
    loss_bcs:
      _target_: inverse.model.loss.MSE
  # Architecture components
  architecture:
    # Positional encoding
    positional_encoding:
      _target_: inverse.model.encoding.GaussianPositionalEncoding
      num_freqs: 10
      d_input:
        _target_: builtins.int
        _args_:
          - _target_: numpy.sum
            _args_:
              - - ${model.parameters.n_lat}
                - ${model.parameters.n_lon}
                - ${model.parameters.n_scans}
    # Input layer
    input_layer:
      _target_: inverse.model.model.LinearBlock
      in_features: ${model.architecture.positional_encoding.d_input}
      out_features: ${model.architecture.hidden_layer.in_features}
      layernorm:
        _target_: torch.nn.Identity
      activation:
        _target_: forward.model.activation.SuperLearnableSwish
        in_features: ${model.architecture.hidden_layer.in_features}
      dropout_rate: 0.1
      init_func:
        _target_: inverse.model.model.SwishInit
        is_first_layer: true
        is_head: false
    # Hidden layer
    n_hidden_layers: 4
    hidden_skip: false
    hidden_layer:
      _target_: inverse.model.model.SirenResidualBlock
      in_features: 128
      out_features: ${model.architecture.hidden_layer.in_features}
      layernorm: ${model.architecture.input_layer.layernorm}
      activation: ${model.architecture.input_layer.activation}
      dropout_rate: ${model.architecture.input_layer.dropout_rate}
      init_func:
        _target_: inverse.model.model.SwishInit
        is_first_layer: false
        is_head: false
    # Output layer
    output_skip: true
    output_n_heads: 1
    output_layer:
      _target_: inverse.model.model.LinearBlock
      in_features: ${model.architecture.hidden_layer.out_features}
      out_features: ${preparation.pca.prof.input.n_comp}
      layernorm: ${model.architecture.input_layer.layernorm}
      activation:
        _target_: torch.nn.Identity
      dropout_rate: 0.0
      init_func:
        _target_: inverse.model.model.SwishInit
        is_first_layer: false
        is_head: true

# Logger configuration
logger:
  # MLflow logger
  ports:
    mlflow: 5008