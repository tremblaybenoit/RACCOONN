# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: inverse_climatology
  - override /preparation: inverse_default
  - override /loader: inverse_static
  - override /model: inverse_operator
  - override /trainer: cpu
  - override /callbacks: inverse_default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "inverse_operator_climatology"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../inverse_outputs"
  run_id: "018"
  data_dir: ../static_clearsky_${data.dtype}

# Trainer configuration
trainer:
  min_epochs: 1  # To prevent early stopping
  max_epochs: 196  # Number of epochs
  precision: 32  # 32-bit precision

# Initialization
# init_from_checkpoint: ../inverse_outputs/inverse_operator_climatology/checkpoints/008/model.ckpt

# Callbacks
callbacks:
  early_stopping:
    patience: 50  # Number of epochs with no improvement after which training will be stopped

# Preparation configuration
preparation:
  # Statistics computation
  statistics:
    # Variables for which to compute statistics
    data:
      # Output path for statistics
      output:
        path: ../static_clearskies_float32/normalization/statistics_clearskies.pkl

# Data configuration
data:
  # Precision
  dtype: 'float32'
  # Pressure filter
  pressure_filter: null
  # Split ratios for training, validation, and test sets
  stage:
    # Training set
    train:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Profile types
          type: ['Air temperature', 'Humidity mixing ratio', 'Ozone mixing ratio']
          # Normalization function and parameters
          normalization:
            _target_: data.transformations.mean_stdev
            _partial_: true
            stats:
              _target_: data.statistics.read_statistics_var
              path: ../static_clearskies_float32/normalization/statistics_clearskies.pkl
              var: 'prof'
              dtype: ${data.dtype}
            axis: null
        # Pressure
        pressure:
          # Loading function
          load:
            path: ${....dir}/pressure_log10.npy
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_neuralODE_cs1.npy
        # Atmospheric profiles
        prof_background:
          load:
            seed: 75
          normalization: ${data.stage.train.vars.prof.normalization}
    # Validation set
    valid:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Profile types
          type: ${data.stage.train.vars.prof.type}
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}
        # Pressure
        pressure:
          # Loading function
          load:
            path: ${....dir}/pressure_log10.npy
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_neuralODE_cs1.npy
        # Atmospheric profiles
        prof_background:
          load:
            seed: 48
          normalization: ${data.stage.train.vars.prof.normalization}
    # Test set
    test:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Profile types
          type: ${data.stage.train.vars.prof.type}
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}
        # Pressure
        pressure:
          # Loading function
          load:
            path: ${....dir}/pressure_log10.npy
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_neuralODE_cs1.npy
        # Brightness temperatures
        hofx_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_clearskies_minmax_1_background.npy
        # Atmospheric profiles
        prof_background:
          load:
            seed: 15
          normalization: ${data.stage.train.vars.prof.normalization}

# Loader configuration
loader:
  batch_size: 24
  num_workers: 8

# Model parameters
model:
  _target_: inverse.model.model.PINNverseOperatorP
  stats: ${data.stage.train.vars.prof.normalization.stats}
  # Transform
  transform:
    _target_: ${data.stage.train.vars.prof.normalization._target_}
    _partial_: true
    stats: ${data.stage.train.vars.prof.normalization.stats}
    axis: ${data.stage.train.vars.prof.normalization.axis}
    inverse_transform: true
  # Optimizer function and parameters
  optimizer:
    # Learning rate
    lr: 0.001
    # Weight decay (L2 regularization)
    weight_decay: 0.00005
  # Learning rate scheduler
  lr_scheduler:
    # Factor to reduce the learning rate
    factor: 0.75
    # Number of epochs with no improvement after which learning rate will be reduced
    patience: 7
  # Model parameters associated with the data (e.g., input/output dimensions) and architecture
  parameters:
    # Number of variables
    n_scans: 0
  min_max: false # TODO: true or false?
  # Loss function and parameters
  loss_func:
    # Function
    _target_: inverse.model.loss.VarLossP # Load loss function
    # Forward model to compute the model equivalent of the observations
    forward_model:
      # Function
      _target_: inverse.model.loss.ForwardModel
      # Configuration of the forward model
      checkpoint_path: '../forward_outputs/forward_emulator_neuralODE/checkpoints/cs_meanstdev_null/model.ckpt'
      config_path: 'model/forward_emulator_neuralODE_cs.yaml'
      # Precision
      dtype: ${data.dtype}
      # Normalization for the profile variables
      # prof_norm:
      #   _target_: data.transformations.min_max
      #   _partial_: true
      #   stats:
      #     _target_: data.statistics.read_statistics_var
      #     path: ../static_clearskies_float32/normalization/statistics_clearskies.pkl
      #     var: 'prof'
      #     dtype: ${data.dtype}
      #   axis: 1
    # Weights for observation (obs), model, and boundary condition (bcs) errors
    lambda_obs: 0.
    lambda_model: 1.
    lambda_bcs: 0.
    lambda_sobolev: 0. #1.e-5
    key_obs: '_mean_stdev'  # TODO: '_phys' or '_mean_stdev'?
    key_model: '_mean_stdev'  # TODO: '_mean_stdev' or '_min_max'?
    clear_sky: false
    # Loss term for observations
    loss_obs:
      # _target_: inverse.model.loss.MSE
      _target_: inverse.model.loss.DiagonalQuadraticForm
      # _target_: inverse.model.loss.DynamicQuadraticForm
      # matrix: ${preparation.covariance.R.output.matrix_inverse.load}
    # Loss term for model variables
    loss_model:
      # _target_: inverse.model.loss.MSE
      _target_: inverse.model.loss.QuadraticForm
      matrix: ${preparation.covariance.B.output.matrix_pseudo_inverse.load}
    # Loss term for boundary conditions
    loss_bcs:
      _target_: inverse.model.loss.MSE
    # Pressure filter: Consider only pressure levels with non-zero variance (for model and bcs errors)
    pressure_filter: null
  # Architecture components
  architecture:
    # Positional encoding
    positional_encoding:
      _target_: inverse.model.encoding.MultiScaleGaussianEncoding
      num_freqs: 20
      d_input:
        _target_: builtins.int
        _args_:
          - _target_: numpy.sum
            _args_:
              - - ${model.parameters.n_lat}
                - ${model.parameters.n_lon}
                - ${model.parameters.n_scans}
                - ${model.parameters.n_pressure}
                - ${model.parameters.n_cloud}
      # [Lat, Lon, Scans, Pressure]
      sigma_per_dim: [ 3.0, 3.0, 3.0 ]
    # Input layer
    input_layer:
      _target_: inverse.model.model.LinearBlock
      in_features: ${model.architecture.positional_encoding.d_input}
      out_features: ${model.architecture.hidden_layer.in_features}
      layernorm:
        _target_: torch.nn.Identity
      activation:
        _target_: forward.model.activation.Sine
        # in_features: ${model.architecture.input_layer.out_features}
        w0: 3.0
      dropout_rate: 0.1
      init_func:
        _target_: inverse.model.model.SirenInit
        is_first_layer: true
        activation: #${model.architecture.input_layer.activation}
          _target_: forward.model.activation.Sine
          w0: 3.0

    # Hidden layer
    hidden_n_layers: 1
    hidden_skip: false
    hidden_layer:
      _target_: inverse.model.model.SirenResidualBlock
      in_features: 128
      out_features: ${model.architecture.hidden_layer.in_features}
      layernorm: ${model.architecture.input_layer.layernorm}
      activation:
        _target_: forward.model.activation.Sine
        # in_features: ${model.architecture.hidden_layer.out_features}
        w0: 1.0
      dropout_rate: ${model.architecture.input_layer.dropout_rate}
      init_func:
        _target_: inverse.model.model.SirenInit
        is_first_layer: false
        activation: #${model.architecture.hidden_layer.activation}
          _target_: forward.model.activation.Sine
          w0: 1.0
    # Output layer
    output_skip: true
    output_n_heads: ${model.parameters.n_prof}
    output_layer:
      _target_: inverse.model.model.LinearBlock
      in_features: ${model.architecture.hidden_layer.out_features}
      out_features: 32
      layernorm: ${model.architecture.hidden_layer.layernorm}
      activation:
        _target_: forward.model.activation.Sine
        # in_features: ${model.architecture.hidden_layer.out_features}
        w0: 1.0
      dropout_rate: 0.1
      init_func:
        _target_: inverse.model.model.SirenInit
        is_first_layer: false
        is_head: true
        activation: #${model.architecture.output_layer.activation}
          _target_: forward.model.activation.Sine
          w0: 1.0
    output_n_layers: 1
    output_final_layer:
      _target_: inverse.model.model.LinearBlock
      in_features: ${model.architecture.hidden_layer.out_features}
      out_features: 1
      layernorm: ${model.architecture.input_layer.layernorm}
      activation:
        _target_: torch.nn.Identity
      dropout_rate: 0.0
      init_func:
        _target_: inverse.model.model.SirenInit
        is_first_layer: false
        is_head: true
        activation: ${model.architecture.output_final_layer.activation}

# Logger configuration
logger:
  # MLflow logger
  ports:
    mlflow: 5031