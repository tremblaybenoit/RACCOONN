# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: forward_recast
  - override /preparation: forward_pca
  - override /loader: forward_default
  - override /model: forward_emulator_pca
  - override /trainer: gpu
  - override /callbacks: forward_default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "forward_emulator_white"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../forward_outputs"
  run_id: "v000"
  data_dir: "../data_float32_cs"

# Callbacks
callbacks:
  early_stopping:
    patience: 20  # Number of epochs with no improvement after which training will be stopped

# Trainer configuration
trainer:
  min_epochs: 1  # To prevent early stopping
  max_epochs: 192  # Number of epochs
  precision: 32  # 32-bit precision

# Preparation configuration
preparation:
  # Statistics computation
  statistics:
    # Output path for statistics
    data:
      output:
        path: ../data_float32/normalization/statistics.pkl
  # PCA decomposition
  pca:
    # Atmospheric profiles
    prof:
      # What the method takes as
      input:
        # Number of principal components to retain
        n_comp: 270
      # What the method produces as output (pickle file)
      output:
        # File path to save/load the PCA object
        path: ${paths.data_dir}/normalization/pca.pkl

# Data configuration
data:
  # Precision
  dtype: 'float32'
  # Split ratios for training, validation, and test sets
  stage:
    # Training set
    train:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof.npy
            split: ${....split}
            dtype: ${data.dtype}
          # Normalization function and parameters
          normalization: null
        prof_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof_background.npy
            split: ${....split}
            dtype: ${data.dtype}
          # Normalization function and parameters
          normalization: null
    # Validation set
    valid:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof.npy
            split: ${....split}
            dtype: ${data.dtype}
          # Normalization function and parameters
          normalization: null
        prof_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof_background.npy
            split: ${....split}
            dtype: ${data.dtype}
          # Normalization function and parameters
          normalization: null
    # Test set
    test:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof.npy
            split: ${....split}
            dtype: ${data.dtype}
          # Normalization function and parameters
          normalization: null
        prof_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof_background.npy
            split: ${....split}
            dtype: ${data.dtype}
          # Normalization function and parameters
          normalization: null
    # Prediction set
    predict:
      # Directory
      dir: ../static_float32_cs/Train2
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof.npy
            split: ${....split}
            dtype: ${data.dtype}
          # Normalization function and parameters
          normalization: null
        prof_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/white_prof_background.npy
            split: ${....split}
            dtype: ${data.dtype}
          # Normalization function and parameters
          normalization: null

# Loader configuration
loader:
  batch_size: 96
  num_workers: 16
  # Split the data into training, validation, and test sets
  stage:
    # Prediction set
    predict:
      results:
        hofx:
          path: ${data.stage.predict.dir}/predict_hofx_v3_pca_cs.npy

# Logger configuration
logger:
  # MLflow logger
  ports:
    mlflow: 5004