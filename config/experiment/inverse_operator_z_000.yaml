# Data configuration
data:
  # Precision
  dtype: 'float32'
  # Split ratios for training, validation, and test sets
  stage:
    # Training set
    train:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Profile types
          type: ['Air temperature', 'Humidity mixing ratio', 'Ozone mixing ratio']
          # Normalization function and parameters
          normalization:
            _target_: data.transformations.mean_stdev
            _partial_: true
            stats:
              _target_: data.statistics.read_statistics_var
              path: ../static_clearskies_float32/normalization/statistics_clearskies.pkl
              var: 'prof'
              dtype: ${data.dtype}
            axis: null
        # Pressure
        pressure:
          # Loading function
          load:
            path: ${....dir}/pressure_log10.npy
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_clearskies_minmax_1.npy
        # Atmospheric profiles
        prof_background:
          load:
            path: ${....dir}/prof_background.npy
          normalization: ${data.stage.train.vars.prof.normalization}
        # x, y, z slant coordinates
        x:
          # Loading function
          load:
            _target_: data.io.load_latlon
            path: ${....dir}/x_slant.npy
            scans:
              _target_: ${....scans.load._target_}
              path: ${....scans.load.path}
            split: ${....split}
            dtype: ${data.dtype}
          # Normalization function and parameters
          normalization:
            _target_: data.transformations.min_max
            _partial_: true
            stats:
