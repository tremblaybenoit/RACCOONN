# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: inverse_recast
  - override /preparation: inverse_default
  - override /loader: inverse_static
  - override /model: inverse_operator
  - override /trainer: cpu
  - override /callbacks: inverse_default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "inverse_operator_z"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../inverse_outputs"
  run_id: "000"
  data_dir: ../static_clearskies_${data.dtype}  # ../static_clearsky_${data.dtype}
  # TODO: First compute statistics on all data

# Trainer configuration
trainer:
  min_epochs: 1  # To prevent early stopping
  max_epochs: 960  # Number of epochs
  precision: 32  # 32-bit precision

# Callbacks
callbacks:
  early_stopping:
    patience: 101  # Number of epochs with no improvement after which training will be stopped

# Preparation configuration
preparation:
  # Statistics computation
  statistics:
    # Variables for which to compute statistics
    data:
      # Output path for statistics
      output:
        path: ../static_clearskies_float32/normalization/statistics_clearskies_z.pkl
  # Compute slant path coordinates
  slant:
    # Training set
    train:
      # Function
      _target_: data.slant_path.compute_slant_path
      _recursive_: false  # Do not instantiate nested objects
      # What the method needs as input
      input:
        # Coordinates
        lat: ${data.stage.train.vars.lat}
        lon: ${data.stage.train.vars.lon}
        pressure: ${data.stage.train.vars.pressure}
        # Meta data
        meta: ${data.stage.train.vars.meta}
        # Profiles
        prof: ${data.stage.train.vars.prof}
      output:
        lat:
          # Output path
          path: ${paths.data_dir}/Train2/lat_slant.npy
          # Save function
          save:
            _target_: numpy.save
            _partial_: true
            _args_:
              - ${preparation.slant.train.output.lat.path}
          # Load function
          load:
            _target_: data.io.load_npy
            _args_:
              - ${preparation.slant.train.output.lat.path}
              - ${data.dtype}
          normalization: ${data.stage.train.vars.lat.normalization}
        lon:
          # Output path
          path: ${paths.data_dir}/Train2/lon_slant.npy
          # Save function
          save:
            _target_: numpy.save
            _partial_: true
            _args_:
              - ${preparation.slant.train.output.lon.path}
          # Load function
          load:
            _target_: data.io.load_npy
            _args_:
              - ${preparation.slant.train.output.lon.path}
              - ${data.dtype}
          normalization: ${data.stage.train.vars.lon.normalization}
        z:
          # Output path
          path: ${paths.data_dir}/Train2/z_slant.npy
          # Save function
          save:
            _target_: numpy.save
            _partial_: true
            _args_:
              - ${preparation.slant.train.output.z.path}
          # Load function
          load:
            _target_: data.io.load_npy
            _args_:
              - ${preparation.slant.train.output.z.path}
              - ${data.dtype}
          normalization: null
        x:
