# Loader configuration
loader:
  batch_size: 24
  num_workers: 8
  # Split the data into training, validation, and test sets
  stage:
    # Training set
    train:
      # Dataset class
      _target_: forward.model.data_loader.TorchDataset
      _recursive_: false
      # Variables to use as input
      input:
        # Input coordinates (keeping the same names for compatibility with the model)
        lat: ${data.stage.train.vars.y}  # lat -> y
        lon: ${data.stage.train.vars.x}  # lon -> x
        pressure: ${data.stage.train.vars.z}  # pressure -> z
    # Validation set
    valid:
      # Dataset class
      _target_: forward.model.data_loader.TorchDataset
      _recursive_: false
      # Variables to use as input
      input:
        # Input coordinates (keeping the same names for compatibility with the model)
        lat: ${data.stage.valid.vars.y}  # lat -> y
        lon: ${data.stage.valid.vars.x}  # lon -> x
        pressure: ${data.stage.valid.vars.z}  # pressure -> z
    # Test set
    test:
      # Dataset class
      _target_: forward.model.data_loader.TorchDataset
      _recursive_: false
      # Variables to use as input
      input:
        # Input coordinates (keeping the same names for compatibility with the model)
        lat: ${data.stage.test.vars.y}  # lat -> y
        lon: ${data.stage.test.vars.x}  # lon -> x
        pressure: ${data.stage.test.vars.z}  # pressure -> z

# Model parameters
model:
  _target_: inverse.model.model.PINNverseOperatorP
  stats: ${data.stage.train.vars.prof.normalization.stats}
  # Transform
  transform:
    _target_: ${data.stage.train.vars.prof.normalization._target_}
    _partial_: true
    stats: ${data.stage.train.vars.prof.normalization.stats}
    axis: ${data.stage.train.vars.prof.normalization.axis}
    inverse_transform: true
  # Optimizer function and parameters
  optimizer:
    # Learning rate
    lr: 0.001
    # Weight decay (L2 regularization)
    weight_decay: 0.00005
  # Learning rate scheduler
  lr_scheduler:
    # Factor to reduce the learning rate
    factor: 0.75
    # Number of epochs with no improvement after which learning rate will be reduced
    patience: 25
  # Model parameters associated with the data (e.g., input/output dimensions) and architecture
  parameters:
    # Number of variables
    n_scans: 0
  min_max: false # TODO: true or false?
  # Loss function and parameters
  loss_func:
    # Function
    _target_: inverse.model.loss.VarLossP # Load loss function
    # Forward model to compute the model equivalent of the observations
    forward_model:
      # Function
      _target_: inverse.model.loss.ForwardModel
      # Configuration of the forward model
      checkpoint_path: 'forward/model/checkpoints/smooth_minmax_1/model.ckpt'
      config_path: 'model/forward_emulator_smooth_cs.yaml'
      # Precision
      dtype: ${data.dtype}
      # Normalization for the profile variables
      prof_norm:
        _target_: data.transformations.min_max
        _partial_: true
        stats:
          _target_: data.statistics.read_statistics_var
          path: ../static_clearskies_float32/normalization/statistics_clearskies.pkl
          var: 'prof'
          dtype: ${data.dtype}
        axis: 1
    # Weights for observation (obs), model, and boundary condition (bcs) errors
    lambda_obs: 100.  # TODO: 0. or 1.?
    lambda_model: 1.
    lambda_bcs: 0.
    lambda_sobolev: 0. #1.e-5
    key_obs: '_phys'  # TODO: '_phys' or '_mean_stdev'?
    key_model: '_mean_stdev'  # TODO: '_mean_stdev' or '_min_max'?
    clear_sky: false
    # Loss term for observations
    loss_obs:
      _target_: inverse.model.loss.DiagonalQuadraticForm
    # Loss term for model variables
    loss_model:
      _target_: inverse.model.loss.QuadraticForm
      matrix:
        _target_: data.pca.load_pca_buffers
        path: ../static_clearskies_float32/normalization/pca_clouds_univariate_000.pkl
        buffer: 'B_inv'
    # Loss term for boundary conditions
    loss_bcs:
      _target_: inverse.model.loss.MSE
    # Pressure filter: Consider only pressure levels with non-zero variance (for model and bcs errors)
    pressure_filter: null  #${data.pressure_filter.load}
  # Architecture components
  architecture:
    # Positional encoding
    positional_encoding:
      _target_: inverse.model.encoding.MultiScaleGaussianEncoding
      num_freqs: 20
      d_input:
        _target_: builtins.int
        _args_:
          - _target_: numpy.sum
            _args_:
              - - ${model.parameters.n_lat}
                - ${model.parameters.n_lon}
                - ${model.parameters.n_scans}
                - ${model.parameters.n_pressure}
                - ${model.parameters.n_cloud}
      # [Lat, Lon, Scans, Pressure]
      sigma_per_dim: [ 10.0, 10.0, 10.0 ]
    # Input layer
    input_layer:
      _target_: inverse.model.model.LinearBlock
      in_features: ${model.architecture.positional_encoding.d_input}
      out_features: ${model.architecture.hidden_layer.in_features}
      layernorm:
        _target_: torch.nn.Identity
      activation:
        _target_: forward.model.activation.NonLearnableSwish
        in_features: ${model.architecture.hidden_layer.in_features}
      dropout_rate: 0.1
      init_func:
        _target_: inverse.model.model.SwishInit
        is_first_layer: true
        is_head: false

    # Hidden layer
    n_hidden_layers: 4
    hidden_skip: false
    hidden_layer:
      _target_: inverse.model.model.SirenResidualBlock
      in_features: 64
      out_features: ${model.architecture.hidden_layer.in_features}
      layernorm: ${model.architecture.input_layer.layernorm}
      activation: ${model.architecture.input_layer.activation}
      dropout_rate: ${model.architecture.input_layer.dropout_rate}
      init_func:
        _target_: inverse.model.model.SwishInit
        is_first_layer: false
        is_head: false
    # Output layer
    output_skip: true
    output_n_heads: ${model.parameters.n_prof}
    output_layer:
      _target_: inverse.model.model.LinearBlock
      in_features: ${model.architecture.hidden_layer.out_features}
      out_features: 32
      layernorm: ${model.architecture.hidden_layer.layernorm}
      activation: ${model.architecture.hidden_layer.activation}
        # _target_: forward.model.activation.NonLearnableSwish
        # in_features: ${model.architecture.output_layer.out_features}
      dropout_rate: 0.1
      init_func:
        _target_: inverse.model.model.SwishInit
        is_first_layer: false
        is_head: true
    output_n_layers: 2
    output_final_layer:
      _target_: inverse.model.model.LinearBlock
      in_features: ${model.architecture.hidden_layer.out_features}
      out_features: 1
      layernorm: ${model.architecture.input_layer.layernorm}
      activation:
        _target_: torch.nn.Identity
      dropout_rate: 0.0
      init_func:
        _target_: inverse.model.model.SwishInit
        is_first_layer: false
        is_head: true

