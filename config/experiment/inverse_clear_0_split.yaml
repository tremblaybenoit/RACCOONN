# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: inverse_default
  - override /preprocessing: inverse_split
  - override /loader: default
  - override /architecture: inverse_singlehead
  - override /loss: var  #var6
  - override /optimizer: default
  - override /scheduler: default
  - override /model: inverse_default
  - override /callbacks: inverse_default
  - override /logger: default
  - override /trainer: cpu

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "inverse_clear_split"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../inverse_outputs"
  run_id: "0_default"
  data_dir: ../synthetic_${data.dtype}_clear_split
  # checkpoint_dir: "code/model/checkpoints/checkpoint"

# Preprocessing
preprocessing:
  # Recast data to new format, spatiotemporal distribution
  recast:
    # What the method needs as input
    input:
      # Mask to apply
      mask:
        # Spatial domain:
        spatial_domain:
          lat_min: -15.0
          lat_max: 2.0
          lon_min: -70.0
          lon_max: -30.0
        # Temporal domain:
        temporal_window:
          scans_min: 170.0
          scans_max: 170.0
        # Cloud/clear sky
        cloud_mask: false
        clear_mask: true
  # Statistics of the dataset
  statistics:
    # What the method produces as output (pickle file)
    output:
      # Path to statistics file
      path: code/data/statistics/synthetic_clear.pkl

# Data configuration
data:
  # Precision
  dtype: 'float32'
  # Source data
  source:
    # Training set
    train:
      # Path to the training data
      dir: ../synthetic_float32_clear/Train2
      # Variables
      variables:
        # Atmospheric profiles
        prof:
          # Types of profiles for clear skies
          type: [ 'Air temperature', 'Humidity mixing ratio', 'Ozone mixing ratio' ]
          # Transformations
          transformations:
            # Normalization function and parameters
            normalization:
              _target_: code.data.transformations.identity
              _partial_: true
              stats:
                _target_: code.preprocessing.statistics.read_statistics_var
                load: ${preprocessing.statistics.output.load}
                key: 'prof'
                dtype: ${data.dtype}
              axis: 1
        # Radiances
        bt_crtm:
          # Channels
          type: [
            'Channel 8', 'Channel 9', 'Channel 10', 'Channel 11', 'Channel 12',
            'Channel 13', 'Channel 14', 'Channel 15', 'Channel 16'
          ]
    # Validation set
    valid:
      # Path to the validation data
      dir: ../synthetic_float32_clear/Val2
    # Test set
    test:
      # Path to the test data
      dir: ../synthetic_float32_clear/Test2
    # Prediction set
    predict:
      # Variables
      variables:
        # Radiances
        bt_forward:
          # Path to the prediction data
          path: '../forward_outputs/forward_clear/runs/default/bt_forward_predict.npy'

  # Split ratios for training, validation, and test sets
  stage:
    # Training set
    train:
      # Variables
      variables:
        # Atmospheric profiles
        prof:
          # Types of profiles for clear skies
          type: [ 'Air temperature', 'Humidity mixing ratio', 'Ozone mixing ratio' ]
          # Transformations
          transformations:
            # Normalization function and parameters
            normalization:
              _target_: code.data.transformations.identity
              _partial_: true
              stats:
                _target_: code.preprocessing.statistics.read_statistics_var
                load: ${preprocessing.statistics.output.load}
                key: 'prof'
                dtype: ${data.dtype}
              axis: 0
        # Atmospheric profiles
        prof_inverse:
          # Types of profiles for clear skies
          type: [ 'Humidity mixing ratio', ]
          # Loading function
          load:
            # Split
            split:
              _target_: code.data.io.split_slice
              _args_:
                - _target_: builtins.slice
                  _args_: [ null ]  # Equivalent to :
                - _target_: builtins.slice
                  _args_: [ 0, 1 ]  # Equivalent to 1:10
                - _target_: builtins.slice
                  _args_: [ null ]  # Equivalent to :
          # Transformations
          transformations:
            # Normalization function and parameters
            normalization:
              _target_: code.data.transformations.min_max
              _partial_: true
              stats:
                _target_: code.preprocessing.statistics.read_statistics_var
                load: ${preprocessing.statistics.output.load}
                key: 'prof'
                dtype: ${data.dtype}
                # Split
                split:
                  _target_: code.data.io.split_slice
                  _args_:
                    - _target_: builtins.slice
                      _args_: [ 0, 1 ]  # Equivalent to 1:10
                    - _target_: builtins.slice
                      _args_: [ null ]  # Equivalent to :
              axis: null
        # Radiances
        bt_crtm:
          # Channels
          type: [
            'Channel 8', 'Channel 9', 'Channel 10', 'Channel 11', 'Channel 12',
            'Channel 13', 'Channel 14', 'Channel 15', 'Channel 16'
          ]
    # Validation set
    valid:
      # Variables
      variables:
        # Atmospheric profiles
        prof_inverse:
          # Loading function
          load:
            # Split
            split: ${data.stage.train.variables.prof_inverse.load.split}
          # Transformations
          transformations: ${data.stage.train.variables.prof_inverse.transformations}
    # Test set
    test:
      # Variables
      variables:
        # Atmospheric profiles
        prof_inverse:
          # Loading function
          load:
            # Split
            split: ${data.stage.train.variables.prof_inverse.load.split}
          # Transformations
          transformations: ${data.stage.train.variables.prof_inverse.transformations}
    # Prediction set
    predict:
      # Variables
      variables:
        # Atmospheric profiles
        prof_inverse:
          # Loading function
          load:
            # Split
            split: ${data.stage.train.variables.prof_inverse.load.split}
          # Transformations
          transformations: ${data.stage.train.variables.prof_inverse.transformations}

# Model configuration
model:
  # Inverse model
  _target_: code.model.inverse.InverseModel1
  prof_index: 0

# Logger configuration
logger:
  # MLflow logger
  ports:
    mlflow: 5003

# Trainer configuration
trainer:
  # Maximum number of epochs
  max_epochs: 1960

# Callbacks configuration
callbacks:
  # Early stopping callback
  early_stopping:
    # Monitor validation loss for early stopping
    patience: 60

# Scheduler configuration
scheduler:
  factor: 0.5
  patience: 1960

# Loader configuration
loader:
  # Batch size for training, validation, and test sets
  batch_size: 32
  # Number of workers for data loading
  num_workers: 8