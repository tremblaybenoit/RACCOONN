# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: forward_recast
  - override /preparation: statistics
  - override /loader: forward_default
  - override /model: forward_emulator
  - override /trainer: gpu
  - override /callbacks: forward_default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "forward_emulator_norm"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../forward_outputs"
  run_id: "meanstdev_null"
  data_dir: "../data_float32"

# Trainer configuration
trainer:
  min_epochs: 1  # To prevent early stopping
  max_epochs: 196  # Number of epochs
  precision: 32  # 32-bit precision

# Preparation configuration
preparation:
  # Statistics computation
  statistics:
    # Output path for statistics
    data:
      output:
        path: ../data_float32/normalization/statistics.pkl

# Data configuration
data:
  # Precision
  dtype: 'float32'
  # Split ratios for training, validation, and test sets
  stage:
    # Training set
    train:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Normalization function and parameters
          normalization:
            # Function
            _target_: data.transformations.mean_stdev
            _partial_: true
            # Min/max values for normalization
            stats:
              _target_: data.statistics.read_statistics_var
              path: ${preparation.statistics.data.output.path}
              var: 'prof'
              dtype: ${data.dtype}
            axis: null
    # Validation set
    valid:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}
    # Test set
    test:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}
    # Prediction set
    predict:
      # Directory
      dir: ../scene_cloud_float32/Test2
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}

# Loader configuration
loader:
  batch_size: 96
  num_workers: 16
  # Split the data into training, validation, and test sets
  stage:
    # Prediction set
    predict:
      results:
        hofx:
          path: ${data.stage.predict.dir}/predict_hofx_meanstdev_null.npy

# Logger configuration
logger:
  # MLflow logger
  ports:
    mlflow: 4999