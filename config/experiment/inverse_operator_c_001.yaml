# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: inverse_recast
  - override /preparation: inverse_default
  - override /loader: inverse_static
  - override /model: inverse_operator_lanczos
  - override /trainer: cpu
  - override /callbacks: inverse_default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "inverse_operator_c"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../inverse_outputs"
  run_id: "001"
  data_dir: ../static_clearsky_${data.dtype}  # ../static_clearsky_${data.dtype}

# Trainer configuration
trainer:
  min_epochs: 1  # To prevent early stopping
  max_epochs: 960  # Number of epochs
  precision: 32  # 32-bit precision

# Callbacks
callbacks:
  early_stopping:
    patience: 101  # Number of epochs with no improvement after which training will be stopped

# Preparation configuration
preparation:
  # Statistics computation
  statistics:
    # Variables for which to compute statistics
    data:
      # Output path for statistics
      output:
        path: ../static_clearskies_float32/normalization/statistics_clearskies.pkl
  # Lanczos decomposition
  lanczos:
    prof_train:
      # Function
      _target_: data.precondition.project_lanczos
      _recursive_: false  # Do not instantiate nested objects
      # What the method needs as input
      input:
        buffers:
          # File path to save/load the Lanczos object
          path: ../static_clearskies_float32/normalization/precondition.pkl
          # Save function
          save:
            _target_: data.io.save_pkl
            _partial_: true
            _args_:
              - ${preparation.lanczos.prof_train.input.buffers.path}
          # Load function
          load:
            _target_: data.io.load_pkl
            _args_:
              - ${preparation.lanczos.prof_train.input.buffers.path}
        # Profile data to project
        data:
          load:
            _target_: data.io.load_var
            _recursive_: false
            _args_:
              - ${data.stage.train.vars.prof}
      output:
        lanczos:
          # Output path for Lanczos projection
          path: ${paths.data_dir}/Train2/prof_precondition.npy
          # Save function
          save:
            _target_: numpy.save
            _partial_: true
            _args_:
              - ${preparation.lanczos.prof_train.output.lanczos.path}
          # Load function
          load:
            _target_: data.io.load_npy
            _args_:
              - ${preparation.lanczos.prof_train.output.lanczos.path}
              - ${data.dtype}
          normalization: null
    prof_valid:
      # Function
      _target_: data.precondition.project_lanczos
      _recursive_: false  # Do not instantiate nested objects
      # What the method needs as input
      input:
