# Data configuration
data:
  # Precision
  dtype: 'float32'
  # Split ratios for training, validation, and test sets
  stage:
    # Training set
    train:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Profile types
          type: ['Air temperature', 'Humidity mixing ratio', 'Ozone mixing ratio']
          # Normalization function and parameters
          normalization: null
        # Pressure
        pressure:
          # Loading function
          load:
            path: ${....dir}/pressure_log10.npy
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_clearskies_minmax_1.npy
        # Atmospheric profiles
        prof_background:
          load:
            path: ${....dir}/prof_background.npy
          normalization: ${data.stage.train.vars.prof.normalization}
        # Lanczos projection of atmospheric profiles
        prof_lanczos:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/prof_precondition.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        prof_background_lanczos:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/prof_background_precondition.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
    # Validation set
    valid:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Profile types
          type: ${data.stage.train.vars.prof.type}
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}
        # Pressure
        pressure:
          # Loading function
          load:
            path: ${....dir}/pressure_log10.npy
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_clearskies_minmax_1.npy
        # Atmospheric profiles
        prof_background:
          load:
            path: ${....dir}/prof_background.npy
          normalization: ${data.stage.train.vars.prof.normalization}
        # Lanczos projection of atmospheric profiles
        prof_lanczos:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/prof_precondition.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        prof_background_lanczos:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/prof_background_precondition.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
    # Test set
    test:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Profile types
          type: ${data.stage.train.vars.prof.type}
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}
        # Pressure
        pressure:
          # Loading function
          load:
            path: ${....dir}/pressure_log10.npy
        # Brightness temperatures
        hofx:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_clearskies_minmax_1.npy
        # Brightness temperatures
        hofx_background:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/predict_hofx_clearskies_minmax_1_background.npy
        # Atmospheric profiles
        prof_background:
          load:
            path: ${....dir}/prof_background.npy
          normalization: ${data.stage.train.vars.prof.normalization}
        # Lanczos projection of atmospheric profiles
        prof_lanczos:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/prof_precondition.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null
        prof_background_lanczos:
          # Loading function
          load:
            _target_: data.io.load_npy
            path: ${....dir}/prof_background_precondition.npy
            split: ${....split}
            dtype: ${data.dtype}
          normalization: null

# Loader configuration
loader:
  batch_size: 24
  num_workers: 8
  # TODO: Modify
  stage:
    train:
      target:
        prof_lanczos: ${data.stage.train.vars.prof_lanczos}
        prof_background_lanczos: ${data.stage.train.vars.prof_background_lanczos}
    valid:
      target:
        prof_lanczos: ${data.stage.valid.vars.prof_lanczos}
        prof_background_lanczos: ${data.stage.valid.vars.prof_background_lanczos}
    test:
      target:
        prof_lanczos: ${data.stage.test.vars.prof_lanczos}
        prof_background_lanczos: ${data.stage.test.vars.prof_background_lanczos}

# Model parameters
model:
  _target_: inverse.model.model.PINNverseOperatorPrecondition
  lanczos_buffers:
    # Load Lanczos buffers
    _target_: data.precondition.load_lanczos_buffers
    path: ${preparation.lanczos.prof_train.input.buffers.path}
  # Optimizer function and parameters
  optimizer:
    # Learning rate
    lr: 0.001
    # Weight decay (L2 regularization)
    weight_decay: 0.005
  # Learning rate scheduler
  lr_scheduler:
    # Factor to reduce the learning rate
    factor: 0.75
    # Number of epochs with no improvement after which learning rate will be reduced
    patience: 25
  # Model parameters associated with the data (e.g., input/output dimensions) and architecture
  parameters:
    # Number of variables
    n_scans: 0
  # Loss function and parameters
  loss_func:
    # Function
    _target_: inverse.model.loss.VarLossR # Load loss function
    # Forward model to compute the model equivalent of the observations
    forward_model:
      # Function
      _target_: inverse.model.loss.ForwardModel
      # Configuration of the forward model
      checkpoint_path: 'forward/model/checkpoints/smooth_minmax_1/model.ckpt'
      config_path: 'model/forward_emulator_smooth_cs.yaml'
      # Precision
      dtype: ${data.dtype}
      # Normalization for the profile variables
      prof_norm:
        _target_: data.transformations.min_max
        _partial_: true
        stats:
          _target_: data.statistics.read_statistics_var
          path: ../static_clearskies_float32/normalization/statistics_clearskies.pkl
          var: 'prof'
          dtype: ${data.dtype}
        axis: 1
    # Weights for observation (obs), model, and boundary condition (bcs) errors
    lambda_obs: 0.  # TODO: 0. or 1.?
    lambda_model: 1.
    lambda_bcs: 0.
    lambda_sobolev: 0. #1.e-5
    key_obs: ''
    key_model: '_lanczos'
    clear_sky: false
    # Loss term for observations
    loss_obs:
      _target_: inverse.model.loss.MSE  #DiagonalQuadraticForm
    # Loss term for model variables
    loss_model:
      _target_: inverse.model.loss.MSE
    # Loss term for boundary conditions
    loss_bcs:
      _target_: inverse.model.loss.MSE
    # Pressure filter: Consider only pressure levels with non-zero variance (for model and bcs errors)
    pressure_filter: null  #${data.pressure_filter.load}
  # Architecture components
  architecture:
    # Positional encoding
    positional_encoding:
      # _target_: inverse.model.encoding.RescaledPositionalEncoding
      # num_freqs: 20
      # d_input:
      #   _target_: builtins.int
      #   _args_:
      #     - _target_: numpy.sum
      #       _args_:
      #         - - ${model.parameters.n_lat}
      #           - ${model.parameters.n_lon}
      #           - ${model.parameters.n_scans}
      # [Lat, Lon, Scans, Pressure]
      # sigma_per_dim: [ 10.0, 10.0, 10.0 ]
      _target_: inverse.model.encoding.MultiScaleGaussianEncoding
      num_freqs: 20
      d_input:
        _target_: builtins.int
        _args_:
          - _target_: numpy.sum
            _args_:
              - - ${model.parameters.n_lat}
                - ${model.parameters.n_lon}
      # [Lat, Lon, Scans, Pressure]
      sigma_per_dim: [ 1.0, 1.0]
    # Input layer
    input_layer:
      _target_: inverse.model.model.LinearBlock
      in_features: ${model.architecture.positional_encoding.d_input}
      out_features: ${model.architecture.hidden_layer.in_features}
      layernorm:
        _target_: torch.nn.Identity
      activation:
        _target_: forward.model.activation.Sine
        w0: 10.0
      dropout_rate: 0.1
      init_func:
        _target_: inverse.model.model.SirenInit
        is_first_layer: true
        activation: ${model.architecture.input_layer.activation}

    # Hidden layer
    hidden_n_layers: 2
    hidden_skip: false
    hidden_layer:
      _target_: inverse.model.model.SirenResidualBlock
      in_features: 128
      out_features: ${model.architecture.hidden_layer.in_features}
      layernorm: ${model.architecture.input_layer.layernorm}
      activation:
        _target_: forward.model.activation.Sine
        w0: 10.0
      dropout_rate: ${model.architecture.input_layer.dropout_rate}
      init_func:
        _target_: inverse.model.model.SirenInit
        is_first_layer: false
        activation: ${model.architecture.hidden_layer.activation}
    # Output layer
    output_skip: true
    output_n_heads: 1
    output_layer:
      _target_: inverse.model.model.LinearBlock
      in_features: ${model.architecture.hidden_layer.out_features}
      out_features:
        _target_: builtins.int
        _args_:
          - _target_: data.lanczos.load_lanczos_buffers
            path: ${model.lanczos_buffers.path}
            buffer: 'n_comp'
      layernorm: ${model.architecture.input_layer.layernorm}
      activation:
        _target_: torch.nn.Identity
      dropout_rate: 0.0
      init_func:
        _target_: inverse.model.model.SirenInit
        is_first_layer: false
        is_head: true
        activation: ${model.architecture.output_layer.activation}

# Logger configuration
logger:
  # MLflow logger
  ports:
    mlflow: 5030