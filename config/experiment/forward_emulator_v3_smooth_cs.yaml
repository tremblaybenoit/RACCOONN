# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: forward_recast
  - override /preparation: statistics
  - override /loader: forward_default
  - override /model: forward_emulator_smooth_cs
  - override /trainer: gpu
  - override /callbacks: forward_default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "forward_emulator_white"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../forward_outputs"
  run_id: "cs000"
  data_dir: "../data_float32_cs"

# Callbacks
callbacks:
  early_stopping:
    patience: 20  # Number of epochs with no improvement after which training will be stopped

# Trainer configuration
trainer:
  min_epochs: 1  # To prevent early stopping
  max_epochs: 192  # Number of epochs
  precision: 32  # 32-bit precision

# Preparation configuration
preparation:
  # Statistics computation
  statistics:
    # Output path for statistics
    data:
      output:
        path: ../data_float32/normalization/statistics.pkl

# Data configuration
data:
  # Precision
  dtype: 'float32'
  # Split ratios for training, validation, and test sets
  stage:
    # Training set
    train:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          type: [ 'Air temperature', 'Humidity mixing ratio', 'Ozone mixing ratio' ]
          # Normalization function and parameters
          normalization:
            # Function
            _target_: data.transformations.min_max
            _partial_: true
            # Min/max values for normalization
            stats:
              _target_: data.statistics.read_statistics_var
              path: ../data_float32_cs/normalization/statistics.pkl
              var: 'prof'
              dtype: ${data.dtype}
            axis: 1
    # Validation set
    valid:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}
    # Test set
    test:
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}
    # Prediction set
    predict:
      # Directory
      dir: ${paths.data_dir}/Train2
      # Variables
      vars:
        # Atmospheric profiles
        prof:
          # Normalization function and parameters
          normalization: ${data.stage.train.vars.prof.normalization}

# Loader configuration
loader:
  batch_size: 96
  num_workers: 16
  persistent_workers: true
  pin_memory: true
  # Split the data into training, validation, and test sets
  stage:
    # Training set
    train:
      # Dataset class
      _target_: forward.model.data_loader.TorchDataset
    # Validation set
    valid:
      # Dataset class
      _target_: forward.model.data_loader.TorchDataset
    # Test set
    test:
      # Dataset class
      _target_: forward.model.data_loader.TorchDataset
    # Prediction set
    predict:
      # Dataset class
      _target_: forward.model.data_loader.TorchDataset
      results:
        hofx:
          path: ${data.stage.predict.dir}/predict_hofx_v3_smooth_cs.npy

# Model parameters
model:
  # Parameters
  parameters:
    data:
      use_prof_vars: [1, 2, 3]
      prof_vars: [ 'Air temperature', 'Humidity mixing ratio', 'Ozone mixing ratio' ]

# Logger configuration
logger:
  # MLflow logger
  ports:
    mlflow: 5004