# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: inverse_recast
  - override /preparation: inverse_default
  - override /loader: inverse_static
  - override /model: inverse_operator
  - override /trainer: gpu
  - override /callbacks: inverse_default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "inverse_operator_static_clearskies"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../inverse_outputs"
  run_id: "wpca_0000"
  data_dir: ../static_clearskies_${data.dtype}

# Trainer configuration
trainer:
  min_epochs: 1  # To prevent early stopping
  max_epochs: 960  # Number of epochs
  precision: 32  # 32-bit precision

# Callbacks
callbacks:
  early_stopping:
    patience: 101  # Number of epochs with no improvement after which training will be stopped

# Preparation configuration
preparation:
  # Statistics computation
  statistics:
    # Variables for which to compute statistics
    data:
      # Output path for statistics
      output:
        path: ${paths.data_dir}/normalization/statistics.pkl
  # PCA decomposition
  pca:
    # Atmospheric profiles
    prof:
      # Function
      _target_: data.pca.compute_pca
      _recursive_: false  # Do not instantiate nested objects
      # pressure_filter: ${data.pressure_filter.load}
      # What the method needs as input
      input:
        # Profile data to compute PCA on
        data:
          load:
            _target_: data.io.load_stack_and_normalize
            _recursive_: false
            stack:
              - ${data.stage.train.vars.prof}
              - ${data.stage.valid.vars.prof}
              - ${data.stage.test.vars.prof}
        alpha: 0.
        mode: univariate
      # What the method produces as output (pickle file)
      output:
        # File path to save/load the PCA object
        path: ${paths.data_dir}/normalization/pca_clouds_${preparation.pca.prof.input.mode}_X00.pkl
        # Save function
        save:
          _target_: data.io.save_pkl
          _partial_: true
          _args_:
            - ${preparation.pca.prof.output.path}
        # Load function
        load:
          _target_: data.io.load_pkl
          _args_:
            - ${preparation.pca.prof.output.path}
    prof_train:
      # Function
      _target_: data.pca.project_pca
      _recursive_: false  # Do not instantiate nested objects
      # What the method needs as input
      input:
        pca_buffers:
          # File path to save/load the PCA object
          path: ${paths.data_dir}/normalization/pca_clouds_p_${preparation.pca.prof.input.mode}.pkl
          # Save function
          save:
            _target_: data.io.save_pkl
            _partial_: true
            _args_:
              - ${paths.data_dir}/normalization/pca_clouds_p_${preparation.pca.prof.input.mode}.pkl
          # Load function
          load:
            _target_: data.io.load_pkl
            _args_:
              - ${paths.data_dir}/normalization/pca_clouds_p_${preparation.pca.prof.input.mode}.pkl
        # Profile data to project
        data:
          load:
            _target_: data.io.load_var_and_normalize
            _recursive_: false
            _args_:
              - ${data.stage.train.vars.prof}
      output:
        pca:
          # Output path for PCA projection
          path: ${paths.data_dir}/Train2/pca_prof_clouds_p_${preparation.pca.prof.input.mode}.npy
          # Save function
          save:
            _target_: numpy.save
            _partial_: true
            _args_:
              - ${preparation.pca.prof_train.output.pca.path}
          # Load function
          load:
            _target_: data.io.load_npy
            _args_:
              - ${preparation.pca.prof_train.output.pca.path}
              - ${data.dtype}
          normalization: null
        pca_white:
          # Output path for PCA projection
          path: ${paths.data_dir}/Train2/white_prof_clouds_p_${preparation.pca.prof.input.mode}.npy
          # Save function
          save:
            _target_: numpy.save
            _partial_: true
            _args_:
              - ${preparation.pca.prof_train.output.pca_white.path}
          # Load function
          load:
            _target_: data.io.load_npy
            _args_:
              - ${preparation.pca.prof_train.output.pca_white.path}
              - ${data.dtype}
          normalization: null
    prof_valid:
      # Function
