# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /paths: default
  - override /hydra: default
  - override /data: inverse_default
  - override /preprocessing: inverse_split
  - override /loader: default
  - override /architecture: inverse_default
  - override /loss: inverse_default
  - override /optimizer: default
  - override /scheduler: default
  - override /model: inverse_default
  - override /callbacks: inverse_default
  - override /logger: default
  - override /trainer: cpu

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "clearsky_log_patch_static"  # Experiment

# Run id (unique identifier for the run)
paths:
  task_dir: "../inverse_outputs"
  run_id: "default"
  data_dir: "../sources/JCSDA/clearsky_log/patch_static"

# Preprocessing
preprocessing:
  # Recast data to new format, spatiotemporal distribution
  recast:
    # What the method needs as input
    input:
      # Mask to apply
      mask:
        # Spatial domain:
        spatial_domain:
          lat_min: -15.0
          lat_max: 2.0
          lon_min: -70.0
          lon_max: -53.0
        # Temporal domain:
        temporal_window:
          scans_min: 170.0
          scans_max: 170.0
        # Cloud/clear sky
        cloud_mask: false
        clear_mask: true
      # Split
      split:
        edge: false
  # Statistics of the dataset
  statistics:
    # What the method produces as output (pickle file)
    output:
      # Path to statistics file
      path: ${paths.data_dir}/../global/statistics/statistics.pkl
  # Covariance
  covariance:
    # B matrix
    B:
      # Function
      _target_: code.preprocessing.covariance.pressure_only_matrix64
      # Univariate or multivariate
      univariate: true
      # Scaling factor to apply to the covariance matrix (e.g., to account for model errors)
      scaling_factor: 1.0
      # Re-centering
      recenter: true
      mean_type: 'temporal'
      apply_transform: true
      # Regularization parameter to ensure numerical stability
      regularization_type: 'correlation_based'
      regularization_factor: 0.01
    # R matrix
    R:
      # Function
      _target_: code.preprocessing.covariance.pressure_only_matrix64
      # Univariate or multivariate
      univariate: false
      # Scaling factor to apply to the covariance matrix (e.g., to account for model errors)
      scaling_factor: 1.0
      # Re-centering
      recenter: true
      mean_type: 'temporal'
      # Regularization parameter to ensure numerical stability
      regularization_type: 'correlation_based'
      regularization_factor: 0.01

# Loss configuration
loss:
  config:
    # Observation loss term: forward-modeled radiance vs. observations
    bt_crtm:
      weight: 0.0
      instance:
        function:
          _target_: code.loss.variational.CholeskyForm
          matrix: ${preprocessing.covariance.R.output.matrix_cholesky.load}
    # Model constraint: inverted profile vs. prior with pressure mask
    prof:
      weight: 1.0
      instance:
        #function:
        #  _target_: code.loss.variational.CholeskyForm
        #  matrix: ${preprocessing.covariance.B.output.matrix_cholesky.load}
        output_keys: 'prof_inverse'
        target_keys: 'prof'

    # Sobolev regularization: horizontal smoothness (lat, lon)
    #sobolev_horizontal:
    #  weight: 0.00000
    #  instance:
    #    output_keys: 'prof_inverse_transformed'

    # Sobolev regularization: vertical smoothness (pressure_log)
    #sobolev_vertical:
    #  weight: 0.00000
    #  instance:
    #    output_keys: 'prof_inverse_transformed'

# Model configuration
model:
  # Forward model - reference external config
  forward_model:
    path: ../forward_outputs/forward_clear_log/checkpoints/default/model.yaml

# Data configuration
data:
  # Precision
  dtype: 'float32'
  select_input: ['lat', 'lon', 'pressure_log']
  # Source data
  source:
    # Training set
    train:
      # Path to the training data
      dir: ${paths.data_dir}/../global/Train2
      # Variables
      variables:
        # Atmospheric profiles
        prof:
          # Types of profiles for clear skies
          type: [ 'Air temperature', 'Humidity mixing ratio', 'Ozone mixing ratio' ]
          # Transformations
          transformations:
            # Normalization function and parameters
            normalization:
              _target_: code.data.transformations.identity
              _partial_: true
              stats:
                _target_: code.preprocessing.statistics.read_statistics_var
                load: ${preprocessing.statistics.output.load}
                key: 'prof'
                dtype: ${data.dtype}
              axis: 1
        # Radiances
        bt_crtm:
          # Channels
          type: [
            'Channel 8', 'Channel 9', 'Channel 10', 'Channel 11', 'Channel 12',
            'Channel 13', 'Channel 14', 'Channel 15', 'Channel 16'
          ]
    # Validation set
    valid:
      # Path to the validation data
      dir: ${paths.data_dir}/../global/Val2
    # Test set
    test:
      # Path to the test data
      dir: ${paths.data_dir}/../global/Test2
    # Prediction set
    predict:
      # Variables
      variables:
        # Radiances
        bt_forward:
          # Path to the prediction data
          path: '../forward_outputs/forward_clear_log/runs/default/bt_forward_predict.npy'

  # Split ratios for training, validation, and test sets
  stage:
    # Training set
    train:
      # Variables
      variables:
        # Atmospheric profiles
        prof:
          # Types of profiles for clear skies
          type: [ 'Air temperature', 'Humidity mixing ratio', 'Ozone mixing ratio' ]
          # Transformations
          transformations:
            # Normalization function and parameters
            normalization:
              _target_: code.data.transformations.identity
              _partial_: true
              stats:
                _target_: code.preprocessing.statistics.read_statistics_var
                load: ${preprocessing.statistics.output.load}
                key: 'prof'
                dtype: ${data.dtype}
              axis: 1
        # Atmospheric profiles
        prof_inverse:
          # Transformations
          transformations:
            # Normalization function and parameters
            normalization:
              _target_: code.data.transformations.min_max
              _partial_: true
              stats:
                _target_: code.preprocessing.statistics.read_statistics_var
                load: ${preprocessing.statistics.output.load}
                key: 'prof'
                dtype: ${data.dtype}
              axis: 1
        # Radiances
        bt_crtm:
          # Channels
          type: [
            'Channel 8', 'Channel 9', 'Channel 10', 'Channel 11', 'Channel 12',
            'Channel 13', 'Channel 14', 'Channel 15', 'Channel 16'
          ]
    # Validation set
    valid:
      # Variables
      variables:
        # Atmospheric profiles
        prof_inverse:
          # Transformations
          transformations: ${data.stage.train.variables.prof_inverse.transformations}
    # Test set
    test:
      # Variables
      variables:
        # Atmospheric profiles
        prof_inverse:
          # Transformations
          transformations: ${data.stage.train.variables.prof_inverse.transformations}
    # Prediction set
    predict:
      # Variables
      variables:
        # Atmospheric profiles
        prof_inverse:
          # Transformations
          transformations: ${data.stage.train.variables.prof_inverse.transformations}

# Architecture configuration
architecture:
  # Positional encoding
  positional_encoding:
    # _target_: code.architecture.encoding.HarmonicEncoding
    d_input: 3
    #num_freqs: [4, 4, 8]
    #freq_mode: "exponential"  # Capture fine pressure variations

# Logger configuration
logger:
  # MLflow logger
  ports:
    mlflow: 5087

# Trainer configuration
trainer:
  # Maximum number of epochs
  max_epochs: 1960

# Callbacks configuration
callbacks:
  # Early stopping callback
  early_stopping:
    # Monitor validation loss for early stopping
    patience: 60

# Scheduler configuration
scheduler:
  factor: 0.75
  patience: 11

# Loader configuration
loader:
  # Batch size for training, validation, and test sets
  batch_size: 32
  # Number of workers for data loading
  num_workers: 8