# Hydra Residual MLP Architecture for Inverse Problems
_target_: inverse.model.architecture.HydraResidualMLP
_recursive_: false

# Positional encoding
positional_encoding:
  _target_: inverse.model.architecture.encoding.RescaledPositionalEncoding
  d_input: ${model.d_input}

# Input layer
input_layer:
  _target_: inverse.model.model.LinearBlock
  in_features: null  # Set by positional encoding
  out_features: 128
  layernorm:
    _target_: torch.nn.Identity
  activation:
    _target_: inverse.model.architecture.activation.Sine
  dropout_rate: 0.1
  init_func:
    _target_: inverse.model.model.SirenInit

# Hidden layers
hidden_n_layers: 2
hidden_skip: false
hidden_layer:
  _target_: inverse.model.model.LinearBlock
  in_features: 128
  out_features: 128
  layernorm:
    _target_: torch.nn.Identity
  activation:
    _target_: inverse.model.architecture.activation.Sine
  dropout_rate: 0.1
  init_func:
    _target_: inverse.model.model.SirenInit

# Output layers
output_skip: false
output_n_heads: 1
output_n_layers: 1
output_layer:
  _target_: inverse.model.model.LinearBlock
  in_features: 128
  out_features: ${model.n_output}
  layernorm:
    _target_: torch.nn.Identity
  activation:
    _target_: torch.nn.Sigmoid
  dropout_rate: 0.0
  init_func:
    _target_: inverse.model.model.SirenInit

output_final_layer: null

