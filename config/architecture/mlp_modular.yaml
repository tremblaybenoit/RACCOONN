# MLPModular using MLPBlocks as building blocks
# Weight initialization is auto-detected based on activation function
_target_: inverse.model.architecture.mlp.MLPModular
_recursive_: false

# Positional encoding
positional_encoding:
  _target_: inverse.model.architecture.encoding.RescaledPositionalEncoding
  d_input: 4

# Input layer (single MLPBlock)
# Auto initialization: Xavier (based on GELU activation)
input_layer:
  _target_: inverse.model.architecture.mlp.MLPBlock
  in_features: null  # Set by positional encoding output
  out_features: 128
  activation:
    _target_: torch.nn.GELU
  norm_type: layer
  dropout_rate: 0.1
  residual: false
  init_func: null  # Set to null for auto-detection based on activation


# Hidden layer (MLPBlock - single block with residual wrapper)
# Auto initialization: Xavier (based on GELU activation)
hidden_layer:
  _target_: inverse.model.architecture.mlp.MLPBlock
  in_features: 128
  out_features: 128
  activation:
    _target_: torch.nn.GELU
  norm_type: layer
  dropout_rate: 0.1
  residual: false
  init_func: null  # Set to null for auto-detection based on activation

# Wrap hidden layer with residual connection
hidden_skip: true

# Single output layer
# Auto initialization: Sigmoid uses Xavier
output_layer:
  _target_: inverse.model.architecture.mlp.MLPBlock
  in_features: 128
  out_features: 127
  activation:
    _target_: torch.nn.Sigmoid
  norm_type: none
  dropout_rate: 0.0
  residual: false
  init_func: null  # Set to null for auto-detection based on activation

# Skip connections
output_skip: false
inject_encoding_hidden: false
inject_encoding_output: false

