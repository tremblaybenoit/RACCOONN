# MLPModular Configuration Examples - Weight Initialization Strategies
# This file demonstrates different weight initialization approaches based on activation functions
#
# Available initialization functions in code.architecture.mlp:
# - init_weights_default: Xavier uniform
# - init_weights_xavier: Xavier uniform with configurable gain
# - init_weights_he: He initialization (for ReLU-like activations)
# - init_weights_siren_first: SIREN first layer (U[-1, 1])
# - init_weights_siren_hidden: SIREN hidden layers (U[-sqrt(1/n_in), sqrt(1/n_in)])
# - init_weights_uniform: Custom uniform initialization
# - get_init_func: Auto-select based on activation function

_target_: code.architecture.mlp.MLPModular
_recursive_: false

# ============================================================================
# EXAMPLE 1: SIREN Network (Sine activation with uniform initialization)
# ============================================================================
# Auto-detection: Sine activation automatically uses uniform initialization

positional_encoding: null

input_layer:
  _target_: code.architecture.mlp.MLPBlock
  in_features: 2
  out_features: 256
  activation:
    _target_: code.architecture.activation.Sine
    w0: 1.0
  norm_type: none
  dropout_rate: 0.0
  # init_func: Auto-selected (uniform) for Sine activation

hidden_layer:
  _target_: code.architecture.mlp.MLPBlock
  in_features: 256
  out_features: 256
  activation:
    _target_: code.architecture.activation.Sine
    w0: 1.0
  norm_type: none
  dropout_rate: 0.0
  # init_func: Auto-selected (uniform) for Sine activation

output_layer:
  _target_: code.architecture.mlp.MLPBlock
  in_features: 256
  out_features: 3
  activation:
    _target_: torch.nn.Sigmoid
  norm_type: none
  dropout_rate: 0.0

