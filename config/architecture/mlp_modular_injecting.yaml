# MLPModular with coordinate injection at hidden and output layers
# Weight initialization is auto-detected: Xavier for GELU activations
_target_: code.architecture.mlp.MLPModular
_recursive_: false

# Positional encoding
positional_encoding:
  _target_: code.architecture.encoding.RescaledPositionalEncoding
  d_input: 4

# Input layer
# Auto initialization: Xavier (based on GELU activation)
input_layer:
  _target_: code.architecture.mlp.MLPBlock
  in_features: null
  out_features: 128
  activation:
    _target_: torch.nn.GELU
  norm_type: layer
  dropout_rate: 0.1
  init_func: null  # Set to null for auto-detection based on activation

# Hidden layer (MLPBlocks with multiple blocks)
# Encoding will be concatenated at the input of this layer
# Auto initialization: Xavier (based on GELU activation)
hidden_layer:
  _target_: code.architecture.mlp.MLPBlocks
  in_features: 128  # Will be adjusted for encoding injection
  out_features: 128
  hidden_features: 128
  n_blocks: 4  # 4 blocks in the hidden layer
  activation:
    _target_: torch.nn.GELU
  norm_type: layer
  dropout_rate: 0.1
  residual: true
  init_func: null  # Set to null for auto-detection (xavier for GELU)

hidden_skip: false  # MLPBlocks already has internal residuals
inject_encoding_hidden: true  # Inject encoding at hidden layer input

# Output layer
# Encoding will be concatenated at the input of this layer
# Auto initialization: Sigmoid uses Xavier
output_layer:
  _target_: code.architecture.mlp.MLPBlock
  in_features: 128  # Will be adjusted for encoding injection
  out_features: 127
  activation:
    _target_: torch.nn.Sigmoid
  dropout_rate: 0.0
  init_func: null  # Set to null for auto-detection (xavier for Sigmoid)

output_skip: false
inject_encoding_output: true  # Inject encoding at output
