# MLPModular mixing different activation types and initialization strategies
_target_: inverse.model.architecture.mlp.MLPModular
_recursive_: false

# Positional encoding
positional_encoding:
  _target_: inverse.model.architecture.encoding.RescaledPositionalEncoding
  d_input: 4

# Input layer with SIREN activation
# Note: Automatically uses uniform initialization based on activation
input_layer:
  _target_: inverse.model.architecture.mlp.MLPBlock
  in_features: null
  out_features: 128
  activation:
    _target_: inverse.model.architecture.activation.Sine
    w0: 30.0
  norm_type: none
  dropout_rate: 0.1
  init_func: null  # Set to null for auto-detection (uniform for Sine)

# Hidden layers - use MLPBlocks to control depth
# MLPBlocks automatically uses xavier initialization (for GELU)
hidden_layer:
  _target_: inverse.model.architecture.mlp.MLPBlocks
  in_features: 128
  out_features: 128
  hidden_features: 256
  n_blocks: 4  # 4 blocks in the hidden layer
  activation:
    _target_: torch.nn.GELU
  norm_type: layer
  dropout_rate: 0.1
  residual: true
  init_func: null  # Set to null for auto-detection (xavier for GELU)
hidden_skip: false  # Already has residuals inside MLPBlocks

# Output layer with Tanh activation for bounded output
# Automatically uses xavier initialization based on activation
output_layer:
  _target_: inverse.model.architecture.mlp.MLPBlock
  in_features: 128
  out_features: 127
  activation:
    _target_: torch.nn.Tanh
  norm_type: none
  dropout_rate: 0.0
  init_func: null  # Set to null for auto-detection (xavier for Tanh)

output_skip: true  # Concatenate input features
inject_encoding_hidden: false
inject_encoding_output: false
