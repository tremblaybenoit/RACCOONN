# CRTM Architecture
_target_: code.architecture.legacy.CRTMArchitecture
_recursive_: true

# Number of input variables
nprofvars: ${data.stage.train.variables.prof.n}
nsurfvars: ${data.stage.train.variables.surf.n}
nmetavars: ${data.stage.train.variables.meta.n}
nlevels: ${data.stage.train.variables.pressure.n}

# Neural network parameters
nnodes_bt: 512
nhidden_bt: 3
dropout_rate: 0.0

# Output activation parameters
bt_norm_max: 355
bt_norm_min: 180
std_output_activation_offset: 0.001
std_scale_trainable: true
out_concat: false