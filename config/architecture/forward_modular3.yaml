_target_: code.architecture.mlp.MLPModular
_recursive_: false

# No positional encoding
positional_encoding: null

# Input layer
input_layer:
  _target_: code.architecture.mlp.MLPBlock
  _recursive_: false
  pre_process:
    _target_: code.architecture.layer.TransformationsLayer
    _partial_: true
    transformations:
      _target_: code.loader.dataset.select_transformations
      _recursive_: false
      config: ${loader.stage.train.input}
  in_features: # Total input features (profiles + surface + meta)
    _target_: builtins.sum
    _args_:
      - - _target_: operator.mul
          _args_:
            - ${data.stage.train.variables.prof.n}
            - ${data.stage.train.variables.pressure.n}
        - ${data.stage.train.variables.surf.n}
        - ${data.stage.train.variables.meta.n}
  out_features: ${..hidden_layer.out_features}
  activation:
    _target_: code.architecture.activation.Swish
  norm_type: none
  dropout_rate: 0.0
  residual: false

# Hidden layers
hidden_layer:
  _target_: code.architecture.mlp.MLPBlocks
  _recursive_: false
  in_features: ${.hidden_features}
  out_features: ${.hidden_features}
  hidden_features: 512
  n_blocks: 2
  activation:
    _target_: code.architecture.activation.Swish
  norm_type: none
  dropout_rate: 0.0
  residual: false

# Output layer: Dual heads (mean and std)
output_layer:
  _target_: code.architecture.mlp.HeterogeneousPredictionHeads
  _recursive_: false
  in_features: ${..hidden_layer.out_features}
  out_concat: false
  heads:
    # Head 1: Mean brightness temperature [0,1] -> denormalized to physical range
    - out_features: ${data.stage.train.variables.hofx.n}
      n_layers: 1
      activation:
        _target_: torch.nn.Sigmoid
      post_process:
        _target_: code.data.transformations.min_max
        _partial_: true
        stats:
          _target_: code.preprocessing.statistics.read_statistics_var
          load: ${preprocessing.statistics.output.load}
          key: 'hofx'
          dtype: ${data.dtype}
        inverse_transform: true

    # Head 2: Std uncertainty with Softplus and learnable scaling
    - out_features: ${data.stage.train.variables.hofx.n}
      n_layers: 1
      activation:
        _target_: torch.nn.Softplus
      post_process:
        _target_: torch.nn.Sequential
        _args_:
          - _target_: code.architecture.layer.ScaleLayer
            scale: 1.0
            learnable: true
          - _target_: code.architecture.layer.OffsetLayer
            offset: 0.001

# Skip connections
hidden_skip: false
output_skip: false
inject_encoding_hidden: false
inject_encoding_output: false