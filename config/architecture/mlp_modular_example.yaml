# Example MLPModular configuration demonstrating output_layer options
# This is a reference file showing different ways to configure the output layer
# and weight initialization strategies.

_target_: inverse.model.architecture.mlp.MLPModular
_recursive_: false

# Positional encoding (optional)
positional_encoding:
  _target_: inverse.model.architecture.encoding.RescaledPositionalEncoding
  d_input: 4

# Input layer
# By default, uses auto-selected initialization based on activation function
input_layer:
  _target_: inverse.model.architecture.mlp.MLPBlock
  in_features: null  # Set by positional encoding
  out_features: 128
  activation:
    _target_: torch.nn.GELU
  norm_type: layer
  dropout_rate: 0.1
  init_func: null  # Set to null for auto-detection (xavier for GELU)
  # Or explicitly set to override:
  # init_func:
  #   _target_: inverse.model.architecture.mlp.init_weights_he

# Hidden layer
# All initialization in MLPBlocks is done per-block using auto-detection
hidden_layer:
  _target_: inverse.model.architecture.mlp.MLPBlocks
  in_features: 128
  out_features: 256
  hidden_features: 128
  n_blocks: 3
  activation:
    _target_: torch.nn.GELU
  norm_type: layer
  dropout_rate: 0.1
  residual: true
  init_func: null  # Set to null for auto-detection (xavier for GELU)

# ============================================================
# OUTPUT LAYER OPTIONS - Choose ONE of the following:
# ============================================================

# Option 1: Simple Linear Layer
# output_layer:
#   _target_: torch.nn.Linear
#   in_features: 256
#   out_features: 127

# Option 2: Single PredictionHead (simple linear)
# output_layer:
#   _target_: inverse.model.architecture.mlp.PredictionHead
#   in_features: 256
#   out_features: 127
#   n_layers: 1

# Option 3: Single PredictionHead (multi-layer)
# output_layer:
#   _target_: inverse.model.architecture.mlp.PredictionHead
#   in_features: 256
#   out_features: 127
#   hidden_features: 128
#   n_layers: 2
#   activation:
#     _target_: torch.nn.GELU
#   dropout_rate: 0.1

# Option 4: Multiple PredictionHeads (multi-task learning)
output_layer:
  _target_: inverse.model.architecture.mlp.PredictionHeads
  n_heads: 3  # Number of prediction heads
  in_features: 256
  out_features: 127  # Output per head (total output: 127 * 3 = 381)
  hidden_features: 128
  n_layers: 2
  activation:
    _target_: torch.nn.GELU
  dropout_rate: 0.0

# Option 5: Custom MLPBlocks as output
# output_layer:
#   _target_: inverse.model.architecture.mlp.MLPBlocks
#   in_features: 256
#   out_features: 127
#   hidden_features: 128
#   n_blocks: 2
#   activation:
#     _target_: torch.nn.GELU
#   final_activation:
#     _target_: torch.nn.Sigmoid
#   dropout_rate: 0.0
#   init_func: null


# ============================================================
# WEIGHT INITIALIZATION EXAMPLES
# ============================================================
# Weight initialization can be:
# 1. AUTO-DETECTED based on activation function (init_func: null, default):
#    - Sine/LearnableSine: Uniform initialization
#    - ReLU/Leaky ReLU/Swish: He initialization
#    - GELU/Tanh/Sigmoid/Scale/Snake: Xavier initialization
#
# 2. EXPLICITLY SPECIFIED in init_func parameter:
#    - init_weights_default: Xavier uniform
#    - init_weights_xavier: Xavier with gain
#    - init_weights_he: He initialization
#    - init_weights_siren_first: SIREN first layer
#    - init_weights_siren_hidden: SIREN hidden layer
#    - init_weights_uniform: Custom uniform

# Example: Override auto-detection with custom init
# input_layer:
#   _target_: inverse.model.architecture.mlp.MLPBlock
#   in_features: null
#   out_features: 128
#   activation:
#     _target_: torch.nn.GELU
#   norm_type: layer
#   dropout_rate: 0.1
#   init_func:
#     _target_: inverse.model.architecture.mlp.init_weights_he

# Skip connections
hidden_skip: false  # MLPBlocks already has internal residuals
output_skip: false
inject_encoding_hidden: false
inject_encoding_output: false

