# Example MLPModular configuration demonstrating output_layer options
# This is a reference file showing different ways to configure the output layer

_target_: inverse.model.architecture.mlp.MLPModular
_recursive_: false

# Positional encoding (optional)
positional_encoding:
  _target_: inverse.model.architecture.encoding.RescaledPositionalEncoding
  d_input: 4

# Input layer
input_layer:
  _target_: inverse.model.architecture.mlp.MLPBlock
  in_features: null  # Set by positional encoding
  out_features: 128
  activation:
    _target_: torch.nn.GELU
  norm_type: layer
  dropout_rate: 0.1

# Hidden layer
hidden_layer:
  _target_: inverse.model.architecture.mlp.MLPBlocks
  in_features: 128
  out_features: 256
  hidden_features: 128
  n_blocks: 3
  activation:
    _target_: torch.nn.GELU
  norm_type: layer
  dropout_rate: 0.1
  residual: true

# ============================================================
# OUTPUT LAYER OPTIONS - Choose ONE of the following:
# ============================================================

# Option 1: Simple Linear Layer
# output_layer:
#   _target_: torch.nn.Linear
#   in_features: 256
#   out_features: 127

# Option 2: Single PredictionHead (simple linear)
# output_layer:
#   _target_: inverse.model.architecture.mlp.PredictionHead
#   in_features: 256
#   out_features: 127
#   n_layers: 1

# Option 3: Single PredictionHead (multi-layer)
# output_layer:
#   _target_: inverse.model.architecture.mlp.PredictionHead
#   in_features: 256
#   out_features: 127
#   hidden_features: 128
#   n_layers: 2
#   activation:
#     _target_: torch.nn.GELU
#   dropout_rate: 0.1

# Option 4: Multiple PredictionHeads (multi-task learning)
output_layer:
  _target_: inverse.model.architecture.mlp.PredictionHeads
  n_heads: 3  # Number of prediction heads
  in_features: 256
  out_features: 127  # Output per head (total output: 127 * 3 = 381)
  hidden_features: 128
  n_layers: 2
  activation:
    _target_: torch.nn.GELU
  dropout_rate: 0.0

# Option 5: Custom MLPBlocks as output
# output_layer:
#   _target_: inverse.model.architecture.mlp.MLPBlocks
#   in_features: 256
#   out_features: 127
#   hidden_features: 128
#   n_blocks: 2
#   activation:
#     _target_: torch.nn.GELU
#   final_activation:
#     _target_: torch.nn.Sigmoid
#   dropout_rate: 0.0

# Skip connections
hidden_skip: false  # MLPBlocks already has internal residuals
output_skip: false
inject_encoding_hidden: false
inject_encoding_output: false


